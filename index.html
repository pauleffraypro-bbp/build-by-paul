<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build By Paul — Coaching &amp; transformation physique</title>
<meta name="description" content="Coaching en ligne, prise de muscle et recomposition corporelle. Un accompagnement 100 % personnalisé, un suivi hebdomadaire et une disponibilité 24 h/24.">
<meta property="og:title" content="Build By Paul — Coaching &amp; transformation physique">
<meta property="og:description" content="Ni du copié-collé. Ni un plan générique. Un accompagnement construit pour toi, jusqu'à ton autonomie.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
<style>
:root{
  --bordeaux:#5C1A24; --bordeaux-deep:#3B0F17; --bordeaux-soft:#7A2A36;
  --creme:#F6EFE2; --creme-soft:#EFE5D2;
  --or:#C9A15A; --sauge:#7C8B6B; --alerte:#B4452F; --encre:#2B1418;
  --radius:18px; --shadow:0 10px 30px rgba(59,15,23,.14);
  --display:'Titan One', system-ui, sans-serif;
  --body:'Fredoka', system-ui, sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}

body{font-family:var(--body);background:var(--creme);color:var(--encre);min-height:100vh;overflow-x:hidden}
h1,h2,h3,h4,.display{font-family:var(--display);font-weight:400;letter-spacing:.5px}

#filigrane{position:fixed;right:-8vw;top:8vh;font-family:var(--display);font-size:70vh;line-height:1;color:var(--bordeaux);opacity:.05;z-index:0;pointer-events:none;user-select:none}
#wipe{position:fixed;inset:0;z-index:999;pointer-events:none;background-image:radial-gradient(var(--bordeaux) 42%, transparent 44%);background-size:26px 26px;opacity:0;clip-path:circle(0% at 50% 50%)}


#gate{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;background:radial-gradient(circle at 15% 20%, rgba(201,161,90,.12), transparent 40%),radial-gradient(circle at 85% 80%, rgba(92,26,36,.10), transparent 45%),var(--creme)}
.logo-b{width:96px;height:96px;border-radius:26px;background:var(--bordeaux);color:var(--creme);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:52px;box-shadow:var(--shadow);position:relative}
.logo-b::after{content:"";position:absolute;inset:6px;border:2px dashed rgba(246,239,226,.35);border-radius:20px}
#gate h1{font-size:clamp(34px,6vw,56px);color:var(--bordeaux);margin:22px 0 4px;text-align:center}
#gate .tag{color:var(--bordeaux-soft);font-weight:500;letter-spacing:3px;text-transform:uppercase;font-size:13px;margin-bottom:34px}
.gate-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:30px 28px;width:min(420px,100%);border-top:6px solid var(--bordeaux)}
.gate-card label{display:block;font-weight:600;font-size:14px;margin-bottom:8px;color:var(--bordeaux)}
.gate-card input{width:100%;padding:14px 16px;border:2px solid var(--creme-soft);border-radius:12px;font-family:var(--body);font-size:17px;letter-spacing:2px;text-transform:uppercase;background:var(--creme)}
.gate-card input:focus{outline:3px solid var(--or);border-color:var(--or)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--bordeaux);color:var(--creme);border:none;border-radius:999px;padding:13px 26px;font-family:var(--body);font-weight:600;font-size:15px;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--bordeaux-soft);transform:translateY(-2px)}
.btn:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.btn.full{width:100%;margin-top:16px}
.btn.ghost{background:transparent;color:var(--bordeaux);border:2px solid var(--bordeaux)}
.btn.ghost:hover{background:var(--bordeaux);color:var(--creme)}
.btn.gold{background:var(--or);color:var(--bordeaux-deep)}
.btn.small{padding:8px 16px;font-size:13px}
#gate-err{color:var(--alerte);font-size:13px;margin-top:10px;min-height:18px;font-weight:500}
.gate-hint{margin-top:22px;font-size:12.5px;color:#8a7466;text-align:center;max-width:420px;line-height:1.5}

#app{display:none;position:relative;z-index:1}
header.bar{position:sticky;top:0;z-index:50;background:rgba(246,239,226,.92);backdrop-filter:blur(8px);border-bottom:2px solid var(--creme-soft);display:flex;align-items:center;gap:14px;padding:12px clamp(16px,4vw,40px);flex-wrap:wrap}
header .mini-b{width:42px;height:42px;border-radius:12px;background:var(--creme-soft);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
header .who{font-weight:600;font-size:15px;color:var(--bordeaux)}
header .who small{display:block;font-weight:400;font-size:11.5px;color:#8a7466;letter-spacing:1px;text-transform:uppercase}
nav.tabs{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
nav.tabs button{border:none;background:transparent;font-family:var(--body);font-weight:600;font-size:14px;color:var(--bordeaux-soft);padding:9px 15px;border-radius:999px;cursor:pointer}
nav.tabs button:hover{background:var(--creme-soft)}
nav.tabs button.on{background:var(--bordeaux);color:var(--creme)}
nav.tabs button:focus-visible{outline:3px solid var(--or)}
main{max-width:1120px;margin:0 auto;padding:clamp(20px,4vw,44px) clamp(16px,4vw,40px) 90px}
.view{display:none}
.view.on{display:block}
}

.eyebrow{letter-spacing:3px;text-transform:uppercase;font-size:12px;font-weight:600;color:var(--or);margin-bottom:6px}
.view h2{font-size:clamp(28px,4.5vw,42px);color:var(--bordeaux);margin-bottom:8px}
.lead{color:#6b5248;font-size:16px;max-width:680px;line-height:1.6;margin-bottom:28px}
.grid{display:grid;gap:18px}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.grid.c3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.grid.c4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;position:relative;overflow:hidden}
.card h3{color:var(--bordeaux);font-size:19px;margin-bottom:8px}
.card p{font-size:14.5px;line-height:1.6;color:#5c4a42}
.card .num{position:absolute;top:10px;right:16px;font-family:var(--display);font-size:44px;color:var(--creme-soft)}

.pole{cursor:pointer;border-left:6px solid var(--bordeaux)}
.pole:hover{transform:translateY(-4px)}
.pole .badge{display:inline-block;background:var(--creme);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600;color:var(--bordeaux);margin:3px 4px 0 0}
.pole-detail{max-height:0;overflow:hidden}
.pole.open .pole-detail{max-height:460px;margin-top:12px}
.pole-detail ul{list-style:none;padding:0}
.pole-detail li{font-size:13.5px;padding:7px 0 7px 22px;position:relative;color:#5c4a42;border-top:1px dashed var(--creme-soft)}
.pole-detail li::before{content:"●";position:absolute;left:4px;color:var(--or);font-size:9px;top:11px}

.flux{display:flex;flex-direction:column;margin-top:8px}
.step{display:flex;gap:18px;position:relative;padding-bottom:26px}
.step::before{content:"";position:absolute;left:21px;top:46px;bottom:0;width:2px;background:repeating-linear-gradient(var(--bordeaux) 0 5px, transparent 5px 11px)}
.step:last-child::before{display:none}
.step .dot{width:44px;height:44px;flex:none;border-radius:50%;background:var(--bordeaux);color:var(--creme);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:16px;box-shadow:var(--shadow)}
.step .dot.gold{background:var(--or)}
.step .dot.sauge{background:var(--sauge)}
.step h4{font-size:16px;color:var(--bordeaux);margin-bottom:3px;font-family:var(--body);font-weight:600}
.step p{font-size:13.5px;color:#5c4a42;line-height:1.55;max-width:580px}
.step .when{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--or);font-weight:600}

.client-card{cursor:pointer;border-top:5px solid var(--bordeaux)}
.client-card:hover{transform:translateY(-4px)}
.client-card .avatar{width:52px;height:52px;border-radius:16px;background:var(--creme);color:var(--bordeaux);font-family:var(--display);font-size:24px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.pill{display:inline-block;border-radius:999px;padding:4px 12px;font-size:11.5px;font-weight:600;letter-spacing:.5px}
.pill.ok{background:#e8eddf;color:#4c5c3c}
.pill.warn{background:#f6e3d8;color:#a03c22}
.pill.neutral{background:var(--creme);color:var(--bordeaux)}

.stat{background:var(--bordeaux);color:var(--creme)}
.stat .big{font-family:var(--display);font-size:38px;line-height:1}
.stat .lbl{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;opacity:.75;margin-top:6px}
.stat.gold{background:var(--or);color:var(--bordeaux-deep)}
.stat.soft{background:#fff;color:var(--bordeaux)}
.stat.soft .lbl{color:#8a7466}

table.data{width:100%;border-collapse:collapse;background:#fff;font-size:13.5px}
table.data th{background:var(--bordeaux);color:var(--creme);text-align:left;padding:12px 14px;font-weight:600;font-size:12px;letter-spacing:1px;text-transform:uppercase;white-space:nowrap}
table.data td{padding:11px 14px;border-top:1px solid var(--creme-soft);vertical-align:top}
table.data tr:hover td{background:var(--creme)}
.table-wrap{overflow-x:auto;border-radius:var(--radius);box-shadow:var(--shadow)}

.form-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.field label{display:block;font-weight:600;font-size:13px;color:var(--bordeaux);margin-bottom:6px}
.field .hint{font-weight:400;color:#9a8478;font-size:11.5px;display:block;margin-top:2px}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border:2px solid var(--creme-soft);border-radius:12px;font-family:var(--body);font-size:14.5px;background:var(--creme)}
.field input:focus,.field select:focus,.field textarea:focus{outline:3px solid var(--or);border-color:var(--or)}
.field.wide{grid-column:1 / -1}
textarea{resize:vertical;min-height:74px}

.fiche-head{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:24px}
.fiche-head .avatar{width:72px;height:72px;border-radius:22px;background:var(--bordeaux);color:var(--creme);font-family:var(--display);font-size:34px;display:flex;align-items:center;justify-content:center}
.kv{display:grid;grid-template-columns:1fr 1fr;font-size:14px}
.kv div{padding:10px 0;border-bottom:1px dashed var(--creme-soft)}
.kv div:nth-child(odd){font-weight:600;color:var(--bordeaux)}
.score-ring{display:flex;align-items:center;gap:14px}
.ring{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:18px;color:var(--creme)}
.msg-ok{background:#e8eddf;color:#4c5c3c;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:500;margin-top:14px;display:none}
.notice{background:var(--creme-soft);border-left:5px solid var(--or);border-radius:12px;padding:14px 16px;font-size:13px;line-height:1.6;color:#6b5248;margin-top:26px}
.back{background:none;border:none;color:var(--bordeaux);font-family:var(--body);font-weight:600;cursor:pointer;font-size:14px;margin-bottom:16px;padding:6px 0}
.back:hover{text-decoration:underline}
.section-title{font-size:20px;color:var(--bordeaux);margin:34px 0 14px;display:flex;align-items:center;gap:10px}
.section-title::after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--bordeaux) 0 6px, transparent 6px 14px);opacity:.25}

/* Boutons supports */
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.link-btn{display:inline-flex;align-items:center;gap:8px;background:var(--creme);color:var(--bordeaux);border:2px solid var(--creme-soft);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;text-decoration:none}
.link-btn:hover{border-color:var(--bordeaux);transform:translateY(-2px)}
.link-btn .ic{font-size:15px}
.link-btn.notion{background:#fff}

/* Accordéon programme */
.acc{border-radius:var(--radius);box-shadow:var(--shadow);background:#fff;margin-bottom:14px;overflow:hidden}
.acc-head{display:flex;align-items:center;gap:12px;padding:16px 20px;cursor:pointer;background:#fff}
.acc-head:hover{background:var(--creme)}
.acc-head h4{font-family:var(--body);font-weight:700;font-size:15.5px;color:var(--bordeaux);flex:1}
.acc-head .count{font-size:12px;color:#9a8478;font-weight:500}
.acc-head .chev{font-family:var(--display);color:var(--or)}
.acc.open .chev{transform:rotate(90deg)}
.acc-body{max-height:0;overflow:hidden}
.acc.open .acc-body{max-height:1400px}
.exo{display:grid;grid-template-columns:minmax(150px,2.2fr) repeat(4,minmax(64px,1fr)) minmax(60px,.9fr);gap:8px;padding:11px 20px;border-top:1px solid var(--creme-soft);font-size:13px;align-items:center}
.exo.head{background:var(--creme);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;font-weight:700;color:var(--bordeaux-soft)}
.exo .nom{font-weight:600;color:var(--encre)}
.exo .nom small{display:block;font-weight:400;color:#9a8478;font-size:11px}
.exo .rir{color:var(--bordeaux-soft);font-weight:600}
.exo .poids{font-weight:700;color:var(--sauge)}
@media(max-width:640px){.exo{grid-template-columns:1.8fr 1fr 1fr 1fr;font-size:12px}.exo .c-rir,.exo .c-repos{display:none}}

/* Plan kcal */
.kcal-row{display:flex;gap:12px;overflow-x:auto;padding:6px 2px 14px}
.kcal-card{flex:0 0 168px;background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:16px;border-top:5px solid var(--or);position:relative}
.kcal-card.on{border-top-color:var(--bordeaux);background:var(--bordeaux);color:var(--creme)}
.kcal-card .k{font-family:var(--display);font-size:22px;color:var(--bordeaux)}
.kcal-card.on .k{color:var(--creme)}
.kcal-card .m{font-size:12px;line-height:1.7;margin-top:8px;color:#6b5248}
.kcal-card.on .m{color:rgba(246,239,226,.85)}
.kcal-card .step-lbl{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;color:var(--or)}
.spark{margin-top:8px}
/* ---- Tuiles cliquables (accueil coach) ---- */
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.tile{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:18px;cursor:pointer;border:2px solid transparent;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit}
.tile:hover{transform:translateY(-3px);border-color:var(--or)}
.tile .t-ic{font-size:24px}
.tile b{color:var(--bordeaux);font-size:15px}
.tile span{font-size:12.5px;color:#8a7466;line-height:1.45}
.tile .go{margin-top:auto;font-size:12px;font-weight:700;color:var(--or);letter-spacing:1px}
.pole-band{display:flex;align-items:center;gap:12px;margin:30px 0 12px}
.pole-band h3{font-size:19px;color:var(--bordeaux)}
.pole-band::after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--bordeaux) 0 6px, transparent 6px 14px);opacity:.25}
/* ---- Modal détail bilan ---- */
#modal{position:fixed;inset:0;z-index:200;display:none;align-items:flex-start;justify-content:center;padding:4vh 16px;background:rgba(43,20,24,.55);backdrop-filter:blur(4px);overflow-y:auto}
#modal.on{display:flex}
.modal-card{background:var(--creme);border-radius:22px;max-width:860px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.4);overflow:hidden}
.modal-head{background:var(--bordeaux);color:var(--creme);padding:22px 26px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.modal-head h3{font-size:22px;color:var(--creme)}
.modal-head .x{margin-left:auto;background:rgba(246,239,226,.15);border:none;color:var(--creme);width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer}
.modal-head .x:hover{background:rgba(246,239,226,.3)}
.modal-body{padding:24px 26px 30px}
.gauge{margin-bottom:12px}
.gauge .g-top{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--bordeaux);margin-bottom:5px}
.gauge .g-bar{height:12px;border-radius:999px;background:var(--creme-soft);overflow:hidden}
.gauge .g-fill{height:100%;border-radius:999px}
.big-rings{display:flex;gap:22px;flex-wrap:wrap;margin:6px 0 20px}
.big-ring{text-align:center}
.big-ring .ring{width:84px;height:84px;font-size:22px;margin:0 auto 6px}
.big-ring small{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#8a7466;font-weight:600}
.quote-block{background:#fff;border-left:5px solid var(--or);border-radius:12px;padding:12px 16px;margin:8px 0;font-size:14px;line-height:1.6}
.quote-block b{color:var(--bordeaux)}
/* ---- Chat coach IA ---- */
.chat-box{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:22px;border-top:6px solid var(--bordeaux)}
.chat-log{max-height:380px;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:11px 15px;border-radius:16px;font-size:14px;line-height:1.55}
.msg.user{align-self:flex-end;background:var(--bordeaux);color:var(--creme);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--creme);color:var(--encre);border-bottom-left-radius:4px}
.msg.bot .src{display:block;margin-top:8px;font-size:11.5px;color:var(--bordeaux-soft);font-weight:600}
.msg.bot.thinking{color:#9a8478;font-style:italic}
.chat-in{display:flex;gap:10px;padding:14px;border-top:2px solid var(--creme-soft)}
.chat-in input{flex:1;padding:12px 15px;border:2px solid var(--creme-soft);border-radius:999px;font-family:var(--body);font-size:14.5px;background:var(--creme)}
.chat-in input:focus{outline:3px solid var(--or);border-color:var(--or)}
/* ---- Mini deck présentation ---- */
.deck{display:flex;gap:16px;overflow-x:auto;padding:6px 2px 18px;scroll-snap-type:x mandatory}
.slide{flex:0 0 min(430px,86vw);scroll-snap-align:start;background:#6B030B;color:#FFE4CA;border-radius:20px;padding:34px 28px;min-height:280px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.slide.light{background:#FFE4CA;color:#6B030B}
.slide h3{font-size:clamp(22px,3vw,30px);line-height:1.15;color:inherit;margin-bottom:12px}
.slide p{font-size:14px;line-height:1.6;opacity:.92;color:inherit}
.slide .dots{position:absolute;right:-20px;top:-20px;width:120px;height:120px;background-image:radial-gradient(currentColor 40%, transparent 44%);background-size:20px 20px;opacity:.15}
.slide .s-num{position:absolute;bottom:14px;right:20px;font-family:var(--display);opacity:.3;font-size:26px}
.slide ul{list-style:none;margin-top:8px}
.slide li{padding:5px 0 5px 20px;position:relative;font-size:13.5px}
.slide li::before{content:"●";position:absolute;left:2px;font-size:9px;top:10px}
/* ---- Page Méthode (publique / prospection) ---- */
.m-hero{background:var(--bordeaux);color:var(--creme);border-radius:26px;padding:clamp(34px,6vw,64px);position:relative;overflow:hidden;margin-bottom:26px}
.m-hero::after{content:"";position:absolute;right:-40px;top:-40px;width:230px;height:230px;background-image:radial-gradient(var(--creme) 38%, transparent 42%);background-size:24px 24px;opacity:.13}
.m-hero .eyebrow{color:var(--or)}
.m-hero h1{font-size:clamp(32px,6vw,58px);line-height:1.05;color:var(--creme);margin-bottom:16px;position:relative}
.m-hero p{font-size:clamp(15px,2vw,18px);line-height:1.6;max-width:600px;opacity:.9;position:relative}
.m-hero .btn{margin-top:26px;background:var(--or);color:var(--bordeaux-deep);position:relative}
.m-hero .btn:hover{background:var(--creme)}
.m-quote{font-family:var(--display);font-size:clamp(20px,3.4vw,32px);color:var(--bordeaux);line-height:1.25;max-width:760px;margin:8px 0 10px}
.m-quote span{color:var(--or)}
/* parcours numéroté */
.parcours{border-top:2px solid var(--creme-soft)}
.p-step{display:grid;grid-template-columns:56px 1fr;gap:20px;padding:26px 0;border-bottom:2px solid var(--creme-soft);align-items:start;cursor:pointer}
.p-step:hover{background:rgba(201,161,90,.06)}
.p-step .p-n{font-family:var(--display);font-size:22px;color:var(--or)}
.p-step .p-when{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:#9a8478;font-weight:600;display:block;margin-bottom:5px}
.p-step h3{font-size:clamp(19px,2.6vw,25px);color:var(--bordeaux);margin-bottom:8px;font-family:var(--display)}
.p-step p{font-size:14.5px;line-height:1.65;color:#5c4a42;max-width:640px}
.p-step .p-more{max-height:0;overflow:hidden}
.p-step.open .p-more{max-height:320px;margin-top:12px}
.p-step .p-more li{list-style:none;font-size:13.5px;color:#5c4a42;padding:6px 0 6px 20px;position:relative;border-top:1px dashed var(--creme-soft)}
.p-step .p-more li::before{content:"●";position:absolute;left:2px;top:9px;font-size:8px;color:var(--or)}
/* qualification */
.qual{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.q-card{border-radius:20px;padding:26px;box-shadow:var(--shadow)}
.q-card.yes{background:#EEF2E7;border:2px solid var(--sauge)}
.q-card.no{background:#fff;border:2px solid var(--creme-soft)}
.q-card h3{font-size:20px;margin-bottom:16px;display:flex;align-items:center;gap:9px}
.q-card.yes h3{color:#4C5C3C}
.q-card.no h3{color:#8a7466}
.q-card li{list-style:none;font-size:14.5px;line-height:1.55;padding:11px 0 11px 30px;position:relative}
.q-card.yes li{color:#3f4d31}
.q-card.no li{color:#8a7466}
.q-card li::before{position:absolute;left:0;top:10px;font-weight:700;font-size:15px}
.q-card.yes li::before{content:"✓";color:var(--sauge)}
.q-card.no li::before{content:"✕";color:#c4b5a6}
/* piliers */
.pilier{background:#fff;border-radius:20px;padding:24px;box-shadow:var(--shadow);border-top:5px solid var(--or);position:relative}
.pilier .p-ic{font-size:28px;margin-bottom:10px;display:block}
.pilier h3{font-size:18px;color:var(--bordeaux);margin-bottom:8px}
.pilier p{font-size:14px;line-height:1.6;color:#5c4a42}
.pilier b{color:var(--bordeaux)}
/* preuve */
.preuve{background:var(--bordeaux);color:var(--creme);border-radius:22px;padding:clamp(26px,4vw,40px);display:grid;gap:26px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));align-items:center}
.preuve h3{font-size:clamp(22px,3.4vw,32px);color:var(--creme);line-height:1.2}
.preuve p{font-size:14.5px;line-height:1.65;opacity:.9}
.preuve .num-big{font-family:var(--display);font-size:clamp(38px,7vw,62px);color:var(--or);line-height:1}
.preuve .num-lbl{font-size:12px;letter-spacing:2px;text-transform:uppercase;opacity:.75;margin-top:6px}
/* faq */
.faq{background:#fff;border-radius:16px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.faq-q{padding:17px 20px;cursor:pointer;display:flex;gap:12px;align-items:center;font-weight:600;font-size:15px;color:var(--bordeaux)}
.faq-q:hover{background:var(--creme)}
.faq-q .chev{margin-left:auto;color:var(--or);font-family:var(--display)}
.faq.open .chev{transform:rotate(90deg)}
.faq-a{max-height:0;overflow:hidden}
.faq.open .faq-a{max-height:300px}
.faq-a p{padding:0 20px 18px;font-size:14px;line-height:1.65;color:#5c4a42}
.m-cta{background:var(--creme-soft);border-radius:22px;padding:clamp(28px,5vw,46px);text-align:center;margin-top:34px}
.m-cta h3{font-size:clamp(24px,4vw,36px);color:var(--bordeaux);margin-bottom:12px}
.m-cta p{font-size:15px;color:#6b5248;max-width:520px;margin:0 auto 22px;line-height:1.6}
/* affirmations diagnostic */
.affirm{background:#fff;border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:5px solid var(--bordeaux)}
.affirm b{display:block;font-family:var(--display);font-size:17px;color:var(--bordeaux);margin-bottom:6px}
.affirm p{font-size:13.5px;line-height:1.6;color:#5c4a42}
/* fiche résultat (façon page partagée client) */
.res-card{background:#fff;border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.res-head{background:var(--bordeaux);color:var(--creme);padding:26px 28px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.res-head .r-av{width:64px;height:64px;border-radius:20px;background:rgba(246,239,226,.16);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:30px;flex:none}
.res-head h3{font-size:26px;color:var(--creme);margin-bottom:2px}
.res-head .r-sub{font-size:13px;opacity:.85}
.res-head .r-pill{margin-left:auto;background:var(--or);color:var(--bordeaux-deep);border-radius:999px;padding:7px 16px;font-size:12.5px;font-weight:700}
.res-body{padding:26px 28px 30px}
.photo-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin:6px 0 22px}
.photo-slot{aspect-ratio:3/4;border-radius:18px;background:var(--creme);border:2px dashed var(--or);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:16px;overflow:hidden;position:relative}
.photo-slot img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.photo-slot .ps-lbl{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--or)}
.photo-slot .ps-hint{font-size:11.5px;color:#9a8478;line-height:1.5}
.photo-cap{position:absolute;bottom:0;left:0;right:0;background:rgba(59,15,23,.82);color:var(--creme);font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;padding:8px;text-align:center;z-index:2}
.res-phases{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:20px}
.res-ph{background:var(--creme);border-radius:14px;padding:14px;border-top:4px solid var(--sauge)}
.res-ph b{display:block;font-size:13px;color:var(--bordeaux);margin-bottom:4px}
.res-ph span{font-size:12px;color:#6b5248;line-height:1.5}
.res-quote{background:var(--creme-soft);border-left:5px solid var(--or);border-radius:12px;padding:16px 18px;font-size:14.5px;line-height:1.65;color:#5c4a42;font-style:italic}

/* ---- Page résultat façon story Gaspard ---- */
.story{background:#FBEFE0;border-radius:26px;padding:clamp(24px,4vw,42px);position:relative;overflow:hidden}
.story::before{content:"B";position:absolute;left:-30px;top:-70px;font-family:var(--display);font-size:270px;color:var(--bordeaux);opacity:.06;line-height:1}
.story::after{content:"B";position:absolute;right:-40px;bottom:-90px;font-family:var(--display);font-size:270px;color:var(--bordeaux);opacity:.05;line-height:1}
.st-brand{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--bordeaux);position:relative;margin-bottom:14px}
.st-brand .dot{width:9px;height:9px;border-radius:50%;background:var(--bordeaux);flex:none}
.st-title{font-family:var(--display);font-size:clamp(30px,5.6vw,50px);line-height:1.05;color:var(--bordeaux);position:relative;margin-bottom:18px}
.st-title small{display:block;font-family:var(--display);font-size:.62em;color:var(--bordeaux-soft)}
.st-ba{width:100%;border-radius:18px;display:block;position:relative;box-shadow:0 12px 30px rgba(59,15,23,.18)}
.st-stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:18px 0;position:relative}
.st-stat{background:#FFF6EA;border-radius:16px;padding:16px;text-align:center}
.st-stat b{display:block;font-family:var(--display);font-size:clamp(20px,3vw,26px);color:var(--bordeaux);line-height:1.1}
.st-stat span{display:block;font-size:12px;font-weight:600;color:var(--bordeaux-soft);margin-top:6px}
.st-msgs{position:relative;margin-top:8px}
.bubble{background:#EEF0F4;border-radius:20px;padding:14px 18px;font-size:14.5px;line-height:1.45;color:#1c1c1e;box-shadow:0 6px 16px rgba(59,15,23,.12);max-width:86%;margin-bottom:12px}
.bubble:nth-child(even){margin-left:auto}
.st-badge{display:inline-flex;align-items:center;gap:9px;background:var(--bordeaux);color:var(--creme);border-radius:999px;padding:10px 20px;font-size:12.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;position:relative;margin-top:10px}
.st-badge .dot{width:9px;height:9px;border-radius:50%;background:var(--or)}

/* ---- Hero avec coach intégré ---- */
.hero2{background:var(--bordeaux);color:var(--creme);border-radius:26px;overflow:hidden;position:relative;display:grid;grid-template-columns:1.15fr .85fr;margin-bottom:30px}
@media(max-width:820px){.hero2{grid-template-columns:1fr}}
.hero2 .h-txt{padding:clamp(30px,5vw,58px);position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center}
.hero2::before{content:"B";position:absolute;left:-34px;bottom:-96px;font-family:var(--display);font-size:300px;line-height:1;color:var(--creme);opacity:.06;z-index:1}
.hero2 .eyebrow{color:var(--or)}
.hero2 h1{font-size:clamp(30px,5.4vw,54px);line-height:1.04;color:var(--creme);margin-bottom:14px}
.hero2 .h-sub{font-size:clamp(15px,1.9vw,17.5px);line-height:1.6;opacity:.92;max-width:460px}
.hero2 .h-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.hero2 .btn{background:var(--or);color:var(--bordeaux-deep)}
.hero2 .btn:hover{background:var(--creme)}
.hero2 .btn.line{background:transparent;color:var(--creme);border:2px solid rgba(246,239,226,.45)}
.hero2 .btn.line:hover{background:rgba(246,239,226,.14);border-color:var(--creme)}
.btn.wa{background:#25D366;color:#0b3d20}
.btn.wa:hover{background:#1eb457;color:#06280f}
.h-tags{display:flex;gap:8px;flex-wrap:wrap}
.h-tag{background:rgba(246,239,226,.14);border-radius:999px;padding:7px 14px;font-size:12px;font-weight:600;letter-spacing:.5px;color:var(--creme)}
.m-hero .btn.line{background:transparent;color:var(--creme);border:2px solid rgba(246,239,226,.45)}
.m-hero .btn.line:hover{background:rgba(246,239,226,.14);border-color:var(--creme)}
.hero2 .h-img{position:relative;min-height:340px;overflow:hidden}
.hero2 .h-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.hero2 .h-img::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg, var(--bordeaux) 0%, rgba(92,26,36,.35) 38%, rgba(92,26,36,0) 70%)}
@media(max-width:820px){.hero2 .h-img{min-height:330px;order:-1}.hero2 .h-img::after{background:linear-gradient(0deg, var(--bordeaux) 0%, rgba(92,26,36,.15) 55%, rgba(92,26,36,0) 100%)}}
.hero2 .h-sign{position:absolute;left:clamp(30px,5vw,58px);bottom:22px;z-index:3;display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--or)}
.hero2 .h-sign .dot{width:8px;height:8px;border-radius:50%;background:var(--or)}
footer{position:relative;z-index:1;text-align:center;padding:26px;font-size:12px;color:#9a8478;letter-spacing:1px}

/* ---- Scène 3D de fond ---- */
html{background:var(--creme)}
body{background:transparent}
#scene3d{position:fixed;inset:0;z-index:0;pointer-events:none;display:block}
#filigrane{display:none}
header.bar,main,footer,#modal{position:relative;z-index:2}
.m-hero{background:rgba(92,26,36,.86);backdrop-filter:blur(6px)}
.story{background:rgba(251,239,224,.9);backdrop-filter:blur(4px)}
.preuve{background:rgba(92,26,36,.9);backdrop-filter:blur(4px)}
.q-card.no,.card,.pilier,.faq,.res-card{background:rgba(255,255,255,.94);backdrop-filter:blur(3px)}
.m-cta{background:rgba(239,229,210,.92);backdrop-filter:blur(4px)}

/* ---- Transitions 3D au clic ---- */
.parcours{perspective:1400px}
.p-step{transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.p-step .p-more{transform-origin:top center;transform:rotateX(-82deg);opacity:0;
  transition:max-height .5s cubic-bezier(.2,.8,.2,1), transform .5s cubic-bezier(.2,.8,.2,1), opacity .35s ease}
.p-step.open .p-more{transform:rotateX(0);opacity:1}
.p-step.open{transform:translateZ(26px)}
.p-step .p-n{transition:transform .5s cubic-bezier(.2,.8,.2,1), color .3s}
.p-step.open .p-n{transform:translateZ(40px) scale(1.25);color:var(--bordeaux)}
.p-step h3{transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.p-step.open h3{transform:translateZ(20px)}

.faq{perspective:1100px;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.8,.2,1), box-shadow .45s}
.faq-a{transform-origin:top center;transform:rotateX(-75deg);opacity:0;
  transition:max-height .45s cubic-bezier(.2,.8,.2,1), transform .45s cubic-bezier(.2,.8,.2,1), opacity .3s ease}
.faq.open .faq-a{transform:rotateX(0);opacity:1}
.faq.open{transform:translateZ(18px);box-shadow:0 18px 44px rgba(59,15,23,.22)}
.faq-q .chev{transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.faq.open .chev{transform:rotate(90deg) translateZ(20px)}

.btn,.link-btn,.tile{transform-style:preserve-3d;
  transition:transform .28s cubic-bezier(.2,.8,.2,1), box-shadow .28s, background .2s}
.btn:hover,.link-btn:hover{transform:translateY(-3px) translateZ(22px) rotateX(8deg);
  box-shadow:0 14px 30px rgba(59,15,23,.28)}
.btn:active,.link-btn:active{transform:translateY(1px) translateZ(4px) rotateX(-6deg) scale(.97)}
.btn.pousse{animation:poussee3d .5s cubic-bezier(.2,.8,.2,1)}
@keyframes poussee3d{
  0%{transform:translateZ(0) rotateX(0) scale(1)}
  35%{transform:translateZ(-18px) rotateX(-12deg) scale(.94)}
  100%{transform:translateZ(0) rotateX(0) scale(1)}}
.links{perspective:900px}
.modal-card{transform-origin:50% 30%;animation:ouverture3d .45s cubic-bezier(.2,.8,.2,1)}
@keyframes ouverture3d{
  from{transform:perspective(1200px) rotateX(-14deg) translateY(-24px) scale(.94);opacity:0}
  to{transform:perspective(1200px) rotateX(0) translateY(0) scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){
  .p-step,.p-step .p-more,.p-step .p-n,.p-step h3,.faq,.faq-a,.faq-q .chev,
  .btn,.link-btn,.tile,.modal-card{transform:none !important;animation:none !important;opacity:1 !important}}

/* ---- Formulaire prospect ---- */
.form-pro{background:rgba(255,255,255,.95);backdrop-filter:blur(4px);border-radius:24px;
  box-shadow:var(--shadow);padding:clamp(24px,4vw,38px);border-top:6px solid var(--bordeaux)}
.form-pro h3{font-size:clamp(21px,3.2vw,28px);color:var(--bordeaux);margin-bottom:8px}
.form-pro .intro{font-size:14.5px;line-height:1.6;color:#6b5248;margin-bottom:22px;max-width:560px}
.q-bloc{margin-bottom:20px}
.q-bloc>label{display:block;font-weight:600;font-size:14px;color:var(--bordeaux);margin-bottom:9px}
.q-bloc .aide{display:block;font-weight:400;font-size:12px;color:#9a8478;margin-top:2px}
.puces{display:flex;flex-wrap:wrap;gap:8px}
.puce{background:var(--creme);border:2px solid var(--creme-soft);border-radius:999px;padding:9px 16px;
  font-family:var(--body);font-size:13.5px;font-weight:600;color:var(--bordeaux-soft);cursor:pointer;
  transition:transform .2s cubic-bezier(.2,.8,.2,1), background .2s, border-color .2s, color .2s}
.puce:hover{border-color:var(--or);transform:translateY(-2px)}
.puce.on{background:var(--bordeaux);border-color:var(--bordeaux);color:var(--creme);transform:translateZ(10px)}
.form-pro input[type=text],.form-pro input[type=email],.form-pro input[type=tel],.form-pro textarea{
  width:100%;padding:12px 14px;border:2px solid var(--creme-soft);border-radius:12px;
  font-family:var(--body);font-size:14.5px;background:var(--creme)}
.form-pro input:focus,.form-pro textarea:focus{outline:3px solid var(--or);border-color:var(--or)}
.form-pro textarea{min-height:86px;resize:vertical}
.pro-msg{border-radius:14px;padding:14px 18px;font-size:14px;line-height:1.6;margin-top:16px;display:none}
.pro-msg.ok{background:#e8eddf;color:#4c5c3c;display:block}
.pro-msg.ko{background:#f6e3d8;color:#a03c22;display:block}
.pro-recap{background:var(--creme);border-radius:14px;padding:16px;font-size:13.5px;
  line-height:1.6;color:#5c4a42;margin-top:14px;white-space:pre-line;display:none}
</style>

function allerA(id){
  const el=document.getElementById(id);
  if(el) el.scrollIntoView({block:"start"});
}
function lienWhats(){
  const n=(SUPPORTS.whatsapp||"").replace(/[^0-9+]/g,"");
  if(!n) return "";
  let d=n.replace(/\+/g,"");
  if(d.startsWith("0")) d="33"+d.slice(1);
  return "https://wa.me/"+d;
}
function lienRdv(){ return SUPPORTS.rdv||""; }
function lienContact(){
  return lienRdv() || lienWhats() || (SUPPORTS.email?`mailto:${SUPPORTS.email}`:"");
}
function openContact(){

        ${e?`<a class="btn full ghost" style="margin:0" href="mailto:${e}">✉️ Envoyer un email</a>`:""}

function btnsContact(taille){
  const c=taille==="small"?" small":"";
  const r=lienRdv(), w=lienWhats();
  let out="";
  if(r) out+=`<a class="btn${c}" href="${r}" target="_blank" rel="noopener">📅 Réserver mon appel →</a>`;
  if(w) out+=`<a class="btn${c} wa" href="${w}" target="_blank" rel="noopener">💬 WhatsApp</a>`;
  if(!r&&!w) out+=`<button class="btn${c}" onclick="openContact()">Prendre contact →</button>`;
  return out;
}

  renderer.setSize(innerWidth, innerHeight);

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(CREME, 16, 66);

  const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 200);
  camera.position.set(0, 0, 4);

  /* ---- Textures typographiques dans la typo de la marque ---- */
  function texteTexture(txt, larg, haut){
    const c = document.createElement("canvas");
    c.width = larg; c.height = haut;
    const x = c.getContext("2d");
    x.clearRect(0,0,larg,haut);
    x.fillStyle = "#fff";
    x.textAlign = "center"; x.textBaseline = "middle";
    let taille = haut * .74;
    x.font = "400 " + taille + "px 'Titan One', system-ui, sans-serif";
    const dispo = larg * .9;
    const mesure = x.measureText(txt).width;
    if(mesure > dispo){                       // ajuste pour ne jamais déborder
      taille = taille * dispo / mesure;
      x.font = "400 " + taille + "px 'Titan One', system-ui, sans-serif";
    }
    x.fillText(txt, larg/2, haut/2 + taille*.04);
    const t = new THREE.CanvasTexture(c);
    t.minFilter = THREE.LinearFilter;
    return t;
  }

  /* Épaissit un mot par superposition de plans */
  function motEpais(tex, largeur, hauteur, couches, ecart, clair, sombre){
    const g = new THREE.Group();
    for(let i=0;i<couches;i++){
      const t = i/(couches-1);
      const mat = new THREE.MeshBasicMaterial({
        map: tex, transparent: true, depthWrite: false,
        color: new THREE.Color(clair).lerp(new THREE.Color(sombre), 1-t),
        opacity: i === couches-1 ? 1 : .96
      });
      const m = new THREE.Mesh(new THREE.PlaneGeometry(largeur, hauteur), mat);
      m.position.z = -i * ecart;
      g.add(m);
    }
    return g;
  }

  const groupeB = new THREE.Group();
  const groupeLogo = new THREE.Group();

  /* Le logo : silhouette du B, avec « By Paul » redessiné net par-dessus */
  function textureLogo(img){
    const L = 900, H = Math.round(L * img.height / img.width);
    const c = document.createElement("canvas");
    c.width = L; c.height = H;
    const x = c.getContext("2d");
    x.drawImage(img, 0, 0, L, H);
    const taille = LOGO_TXT.h * H * 1.55;
    x.font = "600 " + taille + "px 'Fredoka', system-ui, sans-serif";
    x.fillStyle = "#F6EFE2";
    x.textAlign = "left"; x.textBaseline = "alphabetic";
    x.fillText("By Paul", LOGO_TXT.x * L, (LOGO_TXT.y + LOGO_TXT.h) * H);
    const t = new THREE.CanvasTexture(c);
    t.minFilter = THREE.LinearFilter;
    return {tex: t, ratio: L / H};
  }

  function construire(){
    /* La signature, écrite une seule fois, en volume clair */
    const mot = motEpais(texteTexture("BUILD BY PAUL", 1400, 200), 15.4, 2.2,
                         18, .05, 0x9B4653, 0x6E2531);
    mot.position.y = 0;
    groupeB.add(mot);

    /* Le logo, en volume, posé devant la signature */
    const img = new Image();
    img.onload = () => {
      const {tex, ratio} = textureLogo(img);
      const H = 3.4, L = H * ratio;
      const marque = new THREE.Group();
      const COUCHES = 18;
      for(let i=0;i<COUCHES;i++){
        const t = i/(COUCHES-1);
        const m = new THREE.Mesh(
          new THREE.PlaneGeometry(L, H),
          new THREE.MeshBasicMaterial({
            map: tex, transparent:true, depthWrite:false,
            color: new THREE.Color(0xffffff).lerp(new THREE.Color(0xA85560), 1-t),
            opacity: i === COUCHES-1 ? 1 : .97
          })
        );
        m.position.z = -i * .05;
        marque.add(m);
      }
      marque.position.set(0, .1, 0);
      marque.name = "marque";
      groupeLogo.add(marque);
    };
    img.src = LOGO_SRC;

    groupeLogo.position.set(0, .1, -4.2);
    scene.add(groupeLogo);

    groupeB.position.set(0, .2, -12);
    scene.add(groupeB);

  }
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(construire);
  else construire();

  /* ---- Poussière discrète ---- */
  const N = 320, pos = new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const a = Math.random()*Math.PI*2, r = 3 + Math.random()*10;
    pos[i*3]   = Math.cos(a)*r;
    pos[i*3+1] = Math.sin(a)*r*.7;
    pos[i*3+2] = -Math.random()*(PROFONDEUR+20);
  }
  const geoP = new THREE.BufferGeometry();
  geoP.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  const points = new THREE.Points(geoP, new THREE.PointsMaterial({
    color: 0x9B4653, size: .05, transparent:true, opacity:.2, sizeAttenuation:true
  }));
  scene.add(points);

  /* ---- Pilotage par le scroll ---- */
  let cible = 0, courant = 0, sourisX = 0, sourisY = 0;
  function avancement(){
    const h = document.body.scrollHeight - innerHeight;
    return h > 0 ? Math.min(1, Math.max(0, scrollY / h)) : 0;
  }
  addEventListener("scroll", () => { cible = avancement(); }, {passive:true});
  addEventListener("mousemove", e => {
    sourisX = (e.clientX/innerWidth - .5);
    sourisY = (e.clientY/innerHeight - .5);
  }, {passive:true});
  addEventListener("resize", () => {
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    cible = avancement();
  });

  let visible = true;
  document.addEventListener("visibilitychange", () => { visible = !document.hidden; });

  /* ---- Réactions déclenchées par l'interface ---- */
  let pulsation = 0, secousse = 0;
  window.__bbpImpulsion = (i, ouvert) => {
    pulsation = ouvert ? 1 : -.5;
    secousse = Math.max(secousse, .32);
  };
  window.__bbpSecousse = () => { secousse = Math.max(secousse, .22); };

  cible = avancement(); courant = cible;

  function boucle(ms){
    requestAnimationFrame(boucle);
    if(!visible) return;
    const t = ms * .001;

    courant += (cible - courant) * .07;
    camera.position.z = 4 - courant * PROFONDEUR;
    camera.position.x += (sourisX * 1.5 - camera.position.x) * .05;
    camera.position.y += (-sourisY * 1 - camera.position.y) * .05;
    camera.lookAt(0, 0, camera.position.z - 10);

    pulsation += (0 - pulsation) * .05;
    groupeLogo.rotation.y = Math.sin(t*.36) * .42 + courant * 2.4 + pulsation * .7;
    groupeLogo.rotation.x = Math.sin(t*.27) * .12;
    groupeLogo.scale.setScalar(1 + pulsation * .12);
    groupeB.rotation.y = Math.sin(t*.3) * .34 + courant * 1.1 + pulsation * .5;
    groupeB.rotation.x = Math.sin(t*.22) * .09;
    groupeB.scale.setScalar(1 + pulsation * .09);

    points.rotation.z = t*.015;

    if(secousse > .002){
      secousse *= .88;
      camera.position.x += Math.sin(t*44) * secousse * .18;
      camera.position.y += Math.cos(t*39) * secousse * .13;
    }

    renderer.render(scene, camera);
  }
  requestAnimationFrame(boucle);
})();


/* ================= Candidature prospect ================= */
(function(){
  /* Sélection unique dans chaque groupe de puces */
  document.querySelectorAll(".puces").forEach(g => {
    g.addEventListener("click", e => {
      const p = e.target.closest(".puce"); if(!p) return;
      g.querySelectorAll(".puce").forEach(x => x.classList.remove("on"));
      p.classList.add("on");
      if(window.__bbpSecousse) window.__bbpSecousse();
    });
  });
})();

function choix(champ){
  const g = document.querySelector(`.puces[data-champ="${champ}"] .puce.on`);
  return g ? g.textContent.trim() : "";
}

async function envoyerCandidature(){
  const v = id => (document.getElementById(id)?.value || "").trim();
  const msg = document.getElementById("pro-msg");
  const recap = document.getElementById("pro-recap");

  const c = {
    prenom: v("p-prenom"), nom: v("p-nom"), age: v("p-age"),
    tel: v("p-tel"), mail: v("p-mail"), insta: v("p-insta"),
    taille: v("p-taille"), poids: v("p-poids"),
    objectif: choix("objectif"), anciennete: choix("anciennete"),
    seances: choix("seances"), bilan: choix("bilan"), canal: choix("canal"),
    bloque: v("p-bloque"), dispo: v("p-dispo"),
    date: new Date().toISOString(), ts: Date.now()
  };

  const manque = [];
  if(!c.prenom) manque.push("prénom");
  if(!c.nom) manque.push("nom");
  if(!c.age) manque.push("âge");
  if(!c.tel) manque.push("téléphone");
  if(!c.mail) manque.push("email");
  if(c.mail && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c.mail)) manque.push("email valide");
  if(manque.length){
    msg.className = "pro-msg ko";
    msg.textContent = "Il me manque : " + manque.join(", ") + ".";
    const premier = document.getElementById(
      !c.prenom?"p-prenom":!c.nom?"p-nom":!c.age?"p-age":!c.tel?"p-tel":"p-mail");
    if(premier) premier.focus();
    return;
  }

  const texte =
    `Candidature Build By Paul\n\n` +
    `${c.prenom} ${c.nom.toUpperCase()} — ${c.age} ans\n` +
    `Tél : ${c.tel}\n` +
    `Email : ${c.mail}\n` +
    (c.insta ? `Instagram : ${c.insta}\n` : "") +
    ((c.taille || c.poids) ? `Gabarit : ${c.taille ? c.taille+" cm" : "—"} / ${c.poids ? c.poids+" kg" : "—"}\n` : "") +
    `\n` +
    (c.objectif ? `Objectif : ${c.objectif}\n` : "") +
    (c.anciennete ? `Entraînement : ${c.anciennete}\n` : "") +
    (c.seances ? `Séances possibles : ${c.seances} par semaine\n` : "") +
    (c.bilan ? `Bilan hebdo : ${c.bilan}\n` : "") +
    (c.bloque ? `Ce qui bloque : ${c.bloque}\n` : "") +
    (c.canal ? `\nMe recontacter par : ${c.canal}\n` : "") +
    (c.dispo ? `Disponibilités : ${c.dispo}` : "");

  /* 1. Enregistrement côté serveur si le site est hébergé */
  let enregistre = false;
  try {
    const r = await fetch("/api/prospects", {
      method: "POST", headers: {"content-type": "application/json"},
      body: JSON.stringify(c)
    });
    enregistre = r.ok;
  } catch(e) { /* page autonome : on passe par l'envoi direct */ }

  /* 2. Envoi direct vers WhatsApp, avec l'email en secours */
  const w = (typeof lienWhats === "function") ? lienWhats() : "";
  if(w){
    window.open(w + "?text=" + encodeURIComponent(texte), "_blank");
  } else if(SUPPORTS.email){
    window.location.href = "mailto:" + SUPPORTS.email +
      "?subject=" + encodeURIComponent("Candidature — " + c.prenom + " " + c.nom) +
      "&body=" + encodeURIComponent(texte);
  }

  msg.className = "pro-msg ok";
  msg.innerHTML = (w || SUPPORTS.email)
    ? "✅ Candidature prête. La conversation s'ouvre avec ton message déjà rédigé — il ne te reste qu'à l'envoyer."
      + (enregistre ? " Je l'ai aussi reçue de mon côté." : "")
    : (enregistre ? "✅ Candidature reçue. Je te réponds rapidement."
                  : "⚠️ Envoi impossible pour le moment. Copie le récapitulatif ci-dessous et envoie-le-moi.");

  recap.style.display = "block";
  recap.textContent = texte;
  if(window.__bbpSecousse) window.__bbpSecousse();
}

/* ---- Liaison des clics avec la scène 3D ---- */
(function(){
  const reduit = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  /* Chaque étape ouverte propulse son jalon vers la caméra */
  document.querySelectorAll(".p-step").forEach((el, i) => {
    el.addEventListener("click", () => {
      if(window.__bbpImpulsion) window.__bbpImpulsion(i, el.classList.contains("open"));
    });
  });

  /* Chaque question de la FAQ fait vibrer la scène */
  document.querySelectorAll(".faq-q").forEach(q => {
    q.addEventListener("click", () => {
      if(window.__bbpSecousse) window.__bbpSecousse();
    });
  });

  /* Effet d'enfoncement sur les boutons */
  document.addEventListener("click", e => {
    const b = e.target.closest(".btn");
    if(!b || reduit) return;
    b.classList.remove("pousse"); void b.offsetWidth; b.classList.add("pousse");
    setTimeout(() => b.classList.remove("pousse"), 520);
    if(window.__bbpSecousse) window.__bbpSecousse();
  });
})();
