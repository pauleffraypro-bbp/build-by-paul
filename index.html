<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build By Paul — Espace bilans</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
<style>
:root{
  --bordeaux:#5C1A24; --bordeaux-deep:#3B0F17; --bordeaux-soft:#7A2A36;
  --creme:#F6EFE2; --creme-soft:#EFE5D2;
  --or:#C9A15A; --sauge:#7C8B6B; --alerte:#B4452F; --encre:#2B1418;
  --radius:18px; --shadow:0 10px 30px rgba(59,15,23,.14);
  --display:'Titan One', system-ui, sans-serif;
  --body:'Fredoka', system-ui, sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--body);background:var(--creme);color:var(--encre);min-height:100vh;overflow-x:hidden}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.5px}

/* ---------- Accès ---------- */
#gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;
  background:radial-gradient(circle at 15% 20%, rgba(201,161,90,.12), transparent 40%),
             radial-gradient(circle at 85% 80%, rgba(92,26,36,.10), transparent 45%), var(--creme)}
.logo-gate{width:104px;height:104px;display:flex;align-items:center;justify-content:center}
.logo-gate img{width:100%;height:100%;object-fit:contain}
#gate h1{font-size:clamp(30px,5vw,46px);color:var(--bordeaux);margin:18px 0 4px;text-align:center}
#gate .tag{color:var(--bordeaux-soft);letter-spacing:3px;text-transform:uppercase;font-size:12.5px;font-weight:600;margin-bottom:32px}
.gate-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:30px 28px;width:min(420px,100%);border-top:6px solid var(--bordeaux)}
.gate-card label{display:block;font-weight:600;font-size:14px;margin-bottom:8px;color:var(--bordeaux)}
.gate-card input{width:100%;padding:14px 16px;border:2px solid var(--creme-soft);border-radius:12px;
  font-family:var(--body);font-size:17px;letter-spacing:2px;text-transform:uppercase;background:var(--creme)}
.gate-card input:focus{outline:3px solid var(--or);border-color:var(--or)}
#gate-err{color:var(--alerte);font-size:13px;margin-top:10px;min-height:18px;font-weight:500}
.gate-hint{margin-top:22px;font-size:12.5px;color:#8a7466;text-align:center;max-width:400px;line-height:1.55}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--bordeaux);color:var(--creme);
  border:none;border-radius:999px;padding:13px 26px;font-family:var(--body);font-weight:600;font-size:15px;
  cursor:pointer;text-decoration:none}
.btn:hover{background:var(--bordeaux-soft)}
.btn:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.btn.full{width:100%;margin-top:16px}
.btn.ghost{background:transparent;color:var(--bordeaux);border:2px solid var(--bordeaux)}
.btn.ghost:hover{background:var(--bordeaux);color:var(--creme)}
.btn.gold{background:var(--or);color:var(--bordeaux-deep)}
.btn.wa{background:#25D366;color:#0b3d20}
.btn.small{padding:8px 16px;font-size:13px}
.btn.danger{background:transparent;border:2px solid var(--alerte);color:var(--alerte)}
.btn.danger:hover{background:var(--alerte);color:#fff}

/* ---------- Structure ---------- */
#app{display:none}
header.bar{position:sticky;top:0;z-index:50;background:rgba(246,239,226,.94);backdrop-filter:blur(8px);
  border-bottom:2px solid var(--creme-soft);display:flex;align-items:center;gap:14px;padding:11px clamp(14px,4vw,36px);flex-wrap:wrap}
header .mini-b{width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex:none}
header .mini-b img{width:100%;height:100%;object-fit:contain}
header .who{font-weight:600;font-size:15px;color:var(--bordeaux);line-height:1.2}
header .who small{display:block;font-weight:400;font-size:11px;color:#8a7466;letter-spacing:1px;text-transform:uppercase}
nav.tabs{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
nav.tabs button{border:none;background:transparent;font-family:var(--body);font-weight:600;font-size:14px;
  color:var(--bordeaux-soft);padding:9px 15px;border-radius:999px;cursor:pointer}
nav.tabs button:hover{background:var(--creme-soft)}
nav.tabs button.on{background:var(--bordeaux);color:var(--creme)}
nav.tabs button .badge{background:var(--or);color:var(--bordeaux-deep);border-radius:999px;padding:1px 7px;font-size:11px;margin-left:5px}
main{max-width:1100px;margin:0 auto;padding:clamp(18px,4vw,40px) clamp(14px,4vw,36px) 90px}
.view{display:none}
.view.on{display:block}
.eyebrow{letter-spacing:3px;text-transform:uppercase;font-size:11.5px;font-weight:600;color:var(--or);margin-bottom:6px}
.view h2{font-size:clamp(26px,4.2vw,40px);color:var(--bordeaux);margin-bottom:8px}
.lead{color:#6b5248;font-size:15.5px;max-width:660px;line-height:1.6;margin-bottom:26px}
.section-title{font-size:19px;color:var(--bordeaux);margin:32px 0 14px;display:flex;align-items:center;gap:10px;font-family:var(--display)}
.section-title::after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--bordeaux) 0 6px, transparent 6px 14px);opacity:.25}

/* ---------- Cartes ---------- */
.grid{display:grid;gap:16px}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.grid.c3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.grid.c4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.card h3{color:var(--bordeaux);font-size:18px;margin-bottom:8px}
.card p{font-size:14.5px;line-height:1.6;color:#5c4a42}
.stat{background:var(--bordeaux);color:var(--creme)}
.stat .big{font-family:var(--display);font-size:36px;line-height:1}
.stat .lbl{font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;opacity:.75;margin-top:6px}
.stat.gold{background:var(--or);color:var(--bordeaux-deep)}
.stat.soft{background:#fff;color:var(--bordeaux)}
.stat.soft .lbl{color:#8a7466}
.pill{display:inline-block;border-radius:999px;padding:4px 12px;font-size:11.5px;font-weight:600}
.pill.ok{background:#e8eddf;color:#4c5c3c}
.pill.warn{background:#f6e3d8;color:#a03c22}
.pill.neutral{background:var(--creme);color:var(--bordeaux)}
.notice{background:var(--creme-soft);border-left:5px solid var(--or);border-radius:12px;padding:14px 16px;
  font-size:13px;line-height:1.6;color:#6b5248;margin-top:22px}
.vide{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:34px 24px;text-align:center}
.vide .ic{font-size:34px;display:block;margin-bottom:10px}
.vide p{font-size:14.5px;color:#6b5248;max-width:420px;margin:0 auto 14px;line-height:1.6}

/* ---------- Tableaux ---------- */
table.data{width:100%;border-collapse:collapse;background:#fff;font-size:13.5px}
table.data th{background:var(--bordeaux);color:var(--creme);text-align:left;padding:12px 14px;font-weight:600;
  font-size:11.5px;letter-spacing:1px;text-transform:uppercase;white-space:nowrap}
table.data td{padding:11px 14px;border-top:1px solid var(--creme-soft);vertical-align:top}
table.data tr:hover td{background:var(--creme)}
table.data tr.attente td{background:#fdf4ed}
.table-wrap{overflow-x:auto;border-radius:var(--radius);box-shadow:var(--shadow)}

/* ---------- Formulaire ---------- */
.form-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.field label{display:block;font-weight:600;font-size:13px;color:var(--bordeaux);margin-bottom:6px}
.field .hint{display:block;font-weight:400;color:#9a8478;font-size:11.5px;margin-top:2px}
.field input,.field select,.field textarea{width:100%;padding:12px 13px;border:2px solid var(--creme-soft);
  border-radius:12px;font-family:var(--body);font-size:15px;background:var(--creme)}
.field input:focus,.field textarea:focus,.field select:focus{outline:3px solid var(--or);border-color:var(--or)}
.field.wide{grid-column:1 / -1}
textarea{resize:vertical;min-height:74px}
.ref{display:inline-block;font-size:11.5px;color:var(--sauge);font-weight:600;margin-top:5px}
.echelle{display:flex;gap:5px;flex-wrap:wrap}
.echelle button{flex:1;min-width:32px;background:var(--creme);border:2px solid var(--creme-soft);border-radius:10px;
  padding:9px 0;font-family:var(--body);font-weight:600;font-size:14px;color:var(--bordeaux-soft);cursor:pointer}
.echelle button:hover{border-color:var(--or)}
.echelle button.on{background:var(--bordeaux);border-color:var(--bordeaux);color:var(--creme)}
.echelle-bornes{display:flex;justify-content:space-between;font-size:11px;color:#9a8478;margin-top:5px}
.bloc-q{margin-bottom:22px}
.bloc-q>label{display:block;font-weight:600;font-size:13.5px;color:var(--bordeaux);margin-bottom:8px}
.msg{border-radius:12px;padding:13px 16px;font-size:14px;line-height:1.55;margin-top:14px;display:none}
.msg.ok{background:#e8eddf;color:#4c5c3c;display:block}
.msg.ko{background:#f6e3d8;color:#a03c22;display:block}
.apercu{display:flex;gap:14px;flex-wrap:wrap;background:var(--creme);border-radius:14px;padding:14px 16px;margin:16px 0}
.apercu div{flex:1;min-width:120px}
.apercu b{display:block;font-family:var(--display);font-size:22px;line-height:1.1}
.apercu span{font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:#8a7466;font-weight:600}
.progression{height:8px;background:var(--creme-soft);border-radius:999px;overflow:hidden;margin:6px 0 20px}
.progression div{height:100%;background:var(--or);border-radius:999px}
.brouillon{font-size:12px;color:#9a8478;margin-top:8px;min-height:16px}

/* ---------- Modal ---------- */
#modal{position:fixed;inset:0;z-index:200;display:none;align-items:flex-start;justify-content:center;
  padding:4vh 14px;background:rgba(43,20,24,.55);backdrop-filter:blur(4px);overflow-y:auto}
#modal.on{display:flex}
.modal-card{background:var(--creme);border-radius:22px;max-width:880px;width:100%;
  box-shadow:0 30px 80px rgba(0,0,0,.4);overflow:hidden}
.modal-head{background:var(--bordeaux);color:var(--creme);padding:20px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.modal-head h3{font-size:21px;color:var(--creme)}
.modal-head .av{width:46px;height:46px;border-radius:14px;background:rgba(246,239,226,.16);display:flex;
  align-items:center;justify-content:center;font-family:var(--display);font-size:21px;flex:none}
.modal-head .x{margin-left:auto;background:rgba(246,239,226,.15);border:none;color:var(--creme);
  width:38px;height:38px;border-radius:50%;font-size:17px;cursor:pointer}
.modal-body{padding:22px 24px 28px}
.kv{display:grid;grid-template-columns:1fr 1fr;font-size:14px}
.kv div{padding:10px 0;border-bottom:1px dashed var(--creme-soft)}
.kv div:nth-child(odd){font-weight:600;color:var(--bordeaux)}
.anneaux{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.anneau{text-align:center}
.anneau .rond{width:78px;height:78px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-size:20px;color:var(--creme);margin:0 auto 6px}
.anneau small{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:#8a7466;font-weight:600}
.jauge{margin-bottom:12px}
.jauge .haut{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--bordeaux);margin-bottom:5px}
.jauge .barre{height:12px;border-radius:999px;background:var(--creme-soft);overflow:hidden}
.jauge .barre div{height:100%;border-radius:999px}
.cite{background:#fff;border-left:5px solid var(--or);border-radius:12px;padding:12px 16px;margin:8px 0;font-size:14px;line-height:1.6}
.cite b{color:var(--bordeaux)}
.delta{font-size:12px;font-weight:700;margin-left:6px}
.delta.up{color:var(--alerte)}
.delta.down{color:var(--sauge)}
.delta.flat{color:#9a8478}

/* ---- Galerie ---- */
.galerie{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.vignette{position:relative;aspect-ratio:3/4;border:none;padding:0;border-radius:14px;overflow:hidden;
  background:var(--creme-soft);cursor:pointer;box-shadow:var(--shadow);display:block}
.vignette img{width:100%;height:100%;object-fit:cover;display:block}
.vignette .doc{display:flex;align-items:center;justify-content:center;height:100%;font-size:34px}
.vignette .etiq{position:absolute;left:0;right:0;bottom:0;background:rgba(59,15,23,.8);color:var(--creme);
  font-size:10.5px;font-weight:600;padding:5px 4px;letter-spacing:.5px}
.puces{display:flex;flex-wrap:wrap;gap:8px}
.puce{background:var(--creme);border:2px solid var(--creme-soft);border-radius:999px;padding:9px 15px;
  font-family:var(--body);font-size:13px;font-weight:600;color:var(--bordeaux-soft);cursor:pointer}
.puce:hover{border-color:var(--or)}
.puce.on{background:var(--bordeaux);border-color:var(--bordeaux);color:var(--creme)}
/* ---- Observations ---- */
.obs{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-bottom:6px}
.obs-item{background:#fff;border-radius:14px;padding:14px 16px;border-left:5px solid var(--sauge);box-shadow:var(--shadow)}
.obs-item.rouge{border-left-color:var(--alerte);background:#fdf4ef}
.obs-item b{display:block;font-size:13px;color:var(--bordeaux);margin-bottom:3px}
.obs-item span{font-size:13.5px;line-height:1.55;color:#5c4a42}
footer{text-align:center;padding:24px;font-size:11.5px;color:#9a8478;letter-spacing:1px}
</style>
</head>
<body>

<section id="gate">
  <div class="logo-gate"><img id="logo-gate" alt="Build By Paul"></div>
  <h1>Espace bilans</h1>
  <div class="tag">Build By Paul</div>
  <div class="gate-card">
    <label for="code">Ton code d'accès</label>
    <input id="code" type="password" placeholder="Code personnel" autocomplete="off">
    <div id="gate-err" role="alert"></div>
    <button class="btn full" onclick="login()">Entrer</button>
  </div>
  <p class="gate-hint">Chaque client a son code personnel : il n'ouvre que son propre espace et ses propres bilans.</p>
  <a class="btn ghost" style="margin-top:18px" href="/methode/">Découvrir la méthode</a>
</section>

<div id="app">
  <header class="bar">
    <div class="mini-b"><img id="logo-bar" alt="Build By Paul"></div>
    <div class="who"><span id="who-name"></span><small id="who-role"></small></div>
    <nav class="tabs" id="tabs"></nav>
    <button class="btn ghost small" onclick="logout()" style="margin-left:8px">Quitter</button>
  </header>
  <main id="main"></main>
</div>
<div id="modal" onclick="if(event.target===this)closeModal()"></div>
<footer>BUILD BY PAUL · ESPACE BILANS</footer>

/* =================================================================
   Couche technique — fonctionne dans Claude et une fois hébergé
   ================================================================= */
const heberge = () => !(typeof window !== "undefined" && window.storage);
const STORE = {
  async get(k){
    if(!heberge()) return await window.storage.get(k, true);
    if(typeof fetch === "undefined") return null;
    const r = await fetch("/api/store?key=" + encodeURIComponent(k));
    if(!r.ok) throw new Error("lecture");
    const d = await r.json();
    return d.value == null ? null : {key:k, value:d.value};
  },
  async set(k, v){
    if(!heberge()) return await window.storage.set(k, v, true);
    if(typeof fetch === "undefined") return null;
    const r = await fetch("/api/store?key=" + encodeURIComponent(k), {
      method:"PUT", headers:{"content-type":"application/json"}, body: JSON.stringify({value:v})});
    if(!r.ok) throw new Error("écriture");
    return {key:k, value:v};
  },
  async del(k){
    if(!heberge()){ try{ return await window.storage.delete(k, true); }catch(e){ return null; } }
    if(typeof fetch === "undefined") return null;
    try{ await fetch("/api/store?key=" + encodeURIComponent(k), {method:"DELETE"}); }catch(e){}
    return null;
  }
};

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const adher = b => b.prevues > 0 ? Math.round(b.faites / b.prevues * 100) : 0;
const recup = b => Math.round(((+b.sommeil||0) + (10 - (+b.stress||0)) + (+b.motivation||0)) / 3 * 10) / 10;
const alerte = b => adher(b) < 60 || recup(b) < 5;
const teinte = s => s >= 7 ? "var(--sauge)" : s >= 5 ? "var(--or)" : "var(--alerte)";
const teinteAdh = a => a >= 80 ? "var(--sauge)" : a >= 60 ? "var(--or)" : "var(--alerte)";
const bilansDe = nom => bilans().filter(b => b.client === nom).sort((a,b) => String(b.semaine).localeCompare(String(a.semaine)));
const dateFr = d => { try { return new Date(d).toLocaleDateString("fr-FR", {day:"2-digit", month:"short"}); } catch(e){ return d; } };
const lundiCourant = () => { const d = new Date(); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return d.toISOString().slice(0,10); };

function ecart(actuel, precedent, unite, inverse){
  if(actuel == null || precedent == null) return "";
  const d = Math.round((actuel - precedent) * 10) / 10;
  if(d === 0) return `<span class="delta flat">=</span>`;
  const bon = inverse ? d < 0 : d > 0;
  return `<span class="delta ${bon ? "down" : "up"}">${d > 0 ? "+" : ""}${d}${unite||""}</span>`;
}

/* =================================================================
   Graphiques
   ================================================================= */
function courbe(bs, champ, unite, couleur, objectif){
  const pts = bs.slice().reverse().map(b => ({
    x: b.semaine,
    y: champ === "adher" ? adher(b) : champ === "recup" ? recup(b) : (+b[champ] || null)
  })).filter(p => p.y != null);
  if(pts.length < 2) return `<p style="font-size:12.5px;color:#9a8478">Deux bilans suffisent pour voir la tendance.</p>`;
  const w = 520, h = 150, pad = 36;
  const ys = pts.map(p => p.y).concat(objectif ? [objectif] : []);
  const min = Math.min(...ys), max = Math.max(...ys), rg = (max - min) || 1;
  const X = i => pad + (i / (pts.length - 1)) * (w - pad - 14);
  const Y = v => h - 24 - ((v - min) / rg) * (h - 48);
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:560px" role="img" aria-label="Évolution">
    <line x1="${pad}" y1="${h-24}" x2="${w-8}" y2="${h-24}" stroke="var(--creme-soft)" stroke-width="2"/>
    ${objectif ? `<line x1="${pad}" y1="${Y(objectif)}" x2="${w-8}" y2="${Y(objectif)}" stroke="var(--sauge)" stroke-width="2" stroke-dasharray="6 5"/>
      <text x="${w-8}" y="${Y(objectif)-5}" font-size="10" fill="var(--sauge)" text-anchor="end" font-weight="700">objectif ${objectif}${unite}</text>` : ""}
    <text x="4" y="${Y(max)+4}" font-size="11" fill="#8a7466">${max}${unite}</text>
    <text x="4" y="${Y(min)+4}" font-size="11" fill="#8a7466">${min}${unite}</text>
    <polyline points="${pts.map((p,i) => X(i)+","+Y(p.y)).join(" ")}" fill="none" stroke="${couleur}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map((p,i) => `<circle cx="${X(i)}" cy="${Y(p.y)}" r="4.5" fill="${couleur}"/>
      <text x="${X(i)}" y="${h-8}" font-size="9.5" fill="#8a7466" text-anchor="middle">${p.x.slice(5)}</text>`).join("")}
  </svg>`;
}

  if(!bs.length) return "";

/* Compresse une image avant stockage, et fabrique sa vignette */
function traiterImage(file, maxPx, qualite){
  return new Promise((resolve, reject) => {
    const lecteur = new FileReader();
    lecteur.onload = () => {
      const img = new Image();
      img.onload = () => {
        const ech = Math.min(1, maxPx / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * ech); c.height = Math.round(img.height * ech);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL("image/jpeg", qualite));
      };
      img.onerror = reject;
      img.src = lecteur.result;
    };
    lecteur.onerror = reject;
    lecteur.readAsDataURL(file);
  });
}
function lireFichier(file){
  return new Promise((resolve, reject) => {
    const l = new FileReader();
    l.onload = () => resolve(l.result);
    l.onerror = reject;
    l.readAsDataURL(file);
  });
}

async function ajouterFichiers(nom, fileList, cat, retour){
  await chargerMedia(nom);
  const dire = t => { if(retour) retour.textContent = t; };
  let ajoutes = 0;
  for(const file of fileList){
    try{
      const image = file.type.startsWith("image/");
      const video = file.type.startsWith("video/");
      if(video && file.size > MAX_FICHIER){
        dire("« " + file.name + " » est trop lourde pour le portail. Envoie tes vidéos d" + "\u2019" + "exercice par WhatsApp ou Instagram.");
        continue;
      }
      if(!image && file.size > MAX_FICHIER){
        dire(`« ${file.name} » dépasse 5 Mo.`);
        continue;
      }
      const donnee = image ? await traiterImage(file, 1500, .72) : await lireFichier(file);
      const thumb  = image ? await traiterImage(file, 320, .6) : "";
      const id = Date.now().toString(36) + Math.random().toString(36).slice(2,7);
      await STORE.set(cleFichier(id), donnee);
      INDEX_MEDIA[nom].unshift({
        id, cat, nom:file.name, type:file.type, date:new Date().toISOString(),
        thumb, poids: Math.round(donnee.length/1024)
      });
      ajoutes++;
      dire(`${ajoutes} fichier${ajoutes>1?"s":""} ajouté${ajoutes>1?"s":""}…`);
    }catch(e){ dire(`Impossible de traiter « ${file.name} ».`); }
  }
  await sauverIndex(nom);
  dire(ajoutes ? `${ajoutes} fichier${ajoutes>1?"s":""} enregistré${ajoutes>1?"s":""}.` : "Aucun fichier ajouté.");
  return ajoutes;
}

/* =================================================================
   ANALYSE AUTOMATIQUE
   ================================================================= */
function analyseAuto(b, hist){
  const i = hist.findIndex(x => x.ts === b.ts);
  const suite = hist.slice(i, i + 4);          // ce bilan + les 3 précédents
  const obs = [];

  /* Tendance de poids */
  const poids = suite.map(x => x.poids).filter(x => x != null);
  if(poids.length >= 2){
    const d = Math.round((poids[0] - poids[poids.length-1]) * 10) / 10;
    const sem = poids.length - 1;
    const parSem = Math.round(d / sem * 100) / 100;
    let tp = d === 0 ? `Stable sur ${sem} semaine${sem>1?"s":""}.`
      : `${d > 0 ? "+" : ""}${d} kg sur ${sem} semaine${sem>1?"s":""}, soit ${parSem > 0 ? "+" : ""}${parSem} kg/semaine.`;
    const pr = hist[i+1];
    if(b.taille && pr && pr.taille){
      const dt = Math.round((b.taille - pr.taille) * 10) / 10;
      tp += ` Tour de taille ${dt === 0 ? "inchangé" : (dt > 0 ? "+" : "") + dt + " cm"}.`;
      if(d > 0 && dt <= 0) tp += " Le poids monte sans le tour de taille : c'est le bon signe.";
      if(d > 0 && dt > 0.5) tp += " Les deux montent ensemble — surplus probablement trop élevé.";
    }
    obs.push({ic:"⚖️", t:"Poids", txt:tp, alerte: Math.abs(parSem) > 0.6});
  }
  /* Adhérence */
  const adhs = suite.map(adher);
  const moy = Math.round(adhs.reduce((a,b)=>a+b,0) / adhs.length);
  let te = `${adher(b)}% cette semaine, ${moy}% en moyenne sur ${adhs.length} bilan${adhs.length>1?"s":""}.`;
  if(b.perf) te += ` Charges : ${b.perf.toLowerCase()}.`;
  obs.push({ic:"🎯", t:"Entraînement", txt:te, alerte: adher(b) < 60 || (b.perf||"").startsWith("Non")});

  if(b.douleur && b.douleur !== "Aucune"){
    obs.push({ic:"🩹", t:"Douleur signalée",
      txt:`${b.douleur}${b.zoneDouleur ? " — " + b.zoneDouleur : ""}. À traiter avant d'ajouter de la charge.`,
      alerte: b.douleur === "Douleur qui limite"});
  }
  /* Récupération */
  const r = recup(b);
  const detail = [];
  if(b.heures != null && b.heures < 7) detail.push(`${b.heures} h de sommeil`);
  if(+b.sommeil <= 5) detail.push("qualité de sommeil basse");
  if(+b.stress >= 7) detail.push("stress élevé");
  if(+b.motivation <= 5) detail.push("motivation en baisse");
  if(b.courbatures != null && +b.courbatures >= 8) detail.push("courbatures marquées");
  if(b.energie != null && +b.energie <= 4) detail.push("énergie au plancher");
  if(b.humeur != null && +b.humeur <= 4) detail.push("moral bas");
  obs.push({ic:"😴", t:"Récupération",
    txt:`${r}/10${detail.length ? " — " + detail.join(", ") : " — rien à signaler"}.`,
    alerte: r < 5 || (b.heures != null && b.heures < 6.5)});
  /* Nutrition */
  if(b.kcal){
    const prec = hist[i+1];
    const dk = prec && prec.kcal ? b.kcal - prec.kcal : null;
    let t = `${b.kcal} kcal en moyenne${dk != null ? ` (${dk > 0 ? "+" : ""}${dk} vs semaine précédente)` : ""}.`;
    if(b.prot && b.poids) t += ` Protéines à ${(b.prot/b.poids).toFixed(1)} g/kg.`;
    const somme = (b.prot||0)*4 + (b.gluc||0)*4 + (b.lip||0)*9;
    if(somme > 0 && b.prot && b.gluc && b.lip){
      const ecartKcal = Math.round(somme - b.kcal);
      if(Math.abs(ecartKcal) > 200) t += ` Attention : les macros donnent ${Math.round(somme)} kcal, soit ${ecartKcal > 0 ? "+" : ""}${ecartKcal} d'écart avec le total déclaré.`;
    }
    if(b.faim != null && +b.faim >= 8) t += " Faim élevée signalée — à surveiller si ça dure.";
    obs.push({ic:"🍽️", t:"Nutrition", txt:t, alerte: !!(b.prot && b.poids && b.prot/b.poids < 1.5)});
  }

  if(b.track != null){
    obs.push({ic:"📝", t:"Fiabilité du suivi",
      txt:`${b.track}/7 jours trackés.${b.track >= 6 ? " Les chiffres sont exploitables."
        : " Chiffres à prendre avec prudence — l'écart réel est probablement plus élevé."}`,
      alerte: b.track < 5});
  }

  const vie = [];
  if(b.exterieur) vie.push(`${b.exterieur} repas hors plan`);
  if(b.alcool) vie.push(`${b.alcool} verre${b.alcool>1?"s":""} d'alcool`);
  if(b.eau != null) vie.push(`${b.eau} L d'eau par jour`);
  if(vie.length) obs.push({ic:"🌍", t:"Vie courante", txt:vie.join(" · ") + ".",
    alerte: (b.alcool||0) >= 8 || (b.eau != null && b.eau < 1.5)});

  if(b.charge || b.perturbateur){
    let tc = b.charge ? `Charge de travail ${b.charge.toLowerCase()}.` : "";
    if(b.perturbateur && b.perturbateur !== "Rien de spécial") tc += ` Principal frein : ${b.perturbateur.toLowerCase()}.`;
    if(b.charge === "Très chargée" && r < 6) tc += " Le contexte explique en partie la récupération basse — ne pas surcorriger le plan.";
    obs.push({ic:"📅", t:"Contexte de vie", txt:tc.trim(), alerte:false});
  }
  /* Activité */
  if(b.pas) obs.push({ic:"👣", t:"Activité",
    txt:`${(+b.pas).toLocaleString("fr-FR")} pas par jour${b.cardio ? ` · ${b.cardio} séance${b.cardio>1?"s":""} de cardio` : ""}.`,
    alerte:+b.pas < 6000});
  /* Régularité de dépôt */
  if(hist.length >= 2) obs.push({ic:"📅", t:"Régularité", txt:`${hist.length} bilans déposés au total.`, alerte:false});
  return obs;
}

function insererAnalyse(t){
  const z = document.getElementById("an-txt"); if(!z) return;
  z.value = (z.value.trim() ? z.value.trim() + " " : "") + t;
  z.focus();
}
async function enregistrerAnalyse(ts){
  const b = bilans().find(x => x.ts === ts); if(!b) return;
  const z = document.getElementById("an-txt"); if(!z) return;
  const analyse = z.value.trim();
  EDITS.analyses = EDITS.analyses || {};
  EDITS.analyses[cle(b)] = {analyse, statut: analyse ? "Analysé" : "À traiter"};
  await enregistrerEdits();
  const s = saved.find(x => cle(x) === cle(b));
  if(s){ s.analyse = analyse; s.statut = analyse ? "Analysé" : "À traiter"; await enregistrerBilans(); }
  const m = document.getElementById("an-msg");
  if(m){ m.className = "msg ok"; m.textContent = "Retour enregistré. Le client le voit dans son espace."; }
  aller(vueCourante);
}
function envoyerRetour(ts){
  const b = bilans().find(x => x.ts === ts); if(!b) return;
  const z = document.getElementById("an-txt");
  const txt = `Bilan du ${b.semaine} — ${b.client}\n\nAdhérence : ${adher(b)}%\nRécupération : ${recup(b)}/10\n\n${(z?z.value:b.analyse||"").trim()}`;
  window.open(lienWhats() + "?text=" + encodeURIComponent(txt), "_blank");
}
function demanderSuppression(ts){
  const b = bilans().find(x => x.ts === ts); if(!b) return;
  const z = document.getElementById("zone-confirm"); if(!z) return;
  z.innerHTML = `<div style="background:#f6e3d8;border-left:5px solid var(--alerte);border-radius:12px;padding:14px 16px;margin-top:14px">
    <p style="font-size:14px;color:#7a2a1a;margin-bottom:10px"><b>Supprimer le bilan de ${esc(b.client)} — semaine du ${esc(b.semaine)} ?</b></p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn small" style="background:var(--alerte)" onclick="confirmerSuppression(${ts})">Oui, supprimer</button>
      <button class="btn small ghost" onclick="document.getElementById('zone-confirm').innerHTML=''">Annuler</button>
    </div></div>`;
}
async function confirmerSuppression(ts){
  const b = bilans().find(x => x.ts === ts); if(!b) return;
  const k = cle(b);
  EDITS.supprimes = EDITS.supprimes || [];
  if(!EDITS.supprimes.includes(k)) EDITS.supprimes.push(k);
  await enregistrerEdits();
  saved = saved.filter(x => cle(x) !== k);
  await enregistrerBilans();
  closeModal(); aller(vueCourante);
}

/* La liste effective = les champs par défaut + ceux ajoutés, moins ceux désactivés */
function champs(type){
  const conf = EDITS.champs || {};
  const perso = conf.perso || [];
  const off = conf.off || [];
  return [...CHAMPS_DEFAUT, ...perso]
    .filter(c => c.verrou || !off.includes(c.id))
    .filter(c => !type || c.type === type);
}

function brancherFormulaire(){
  document.querySelectorAll(".puces[data-champ]").forEach(g => {
    g.addEventListener("click", e => {
      const p = e.target.closest(".puce"); if(!p) return;
      g.querySelectorAll(".puce").forEach(x => x.classList.remove("on"));
      p.classList.add("on");
      if(g.dataset.champ === "douleur"){
        const z = document.getElementById("bloc-zoneDouleur");
        if(z) z.style.display = p.textContent.trim() === "Aucune" ? "none" : "block";
      }
      majApercu(); sauverBrouillon();
    });
  });
  document.querySelectorAll(".echelle").forEach(g => {
    g.addEventListener("click", e => {
      const b = e.target.closest("button"); if(!b) return;
      g.querySelectorAll("button").forEach(x => x.classList.remove("on"));
      b.classList.add("on");
      majApercu(); sauverBrouillon();
    });
  });
  document.querySelectorAll(".card input, .card textarea").forEach(i => {
    i.addEventListener("input", () => { majApercu(); sauverBrouillon(); });
  });
  restaurerBrouillon();
  majApercu();
  brancherDepot(session.nom, "dep-bilan", () => rafraichirApercuMedia());
  rafraichirApercuMedia();
}
async function rafraichirApercuMedia(){
  const z = document.getElementById("apercu-media"); if(!z) return;
  const liste = await chargerMedia(session.nom);
  z.innerHTML = liste.length ? grilleMedia(session.nom, liste.slice(0,8), "") : "";
}

const choixPuce = champ => {
  const b = document.querySelector(`.puces[data-champ="${champ}"] .puce.on`);
  return b ? b.textContent.trim() : "";
};
const valEchelle = champ => {
  const b = document.querySelector(`.echelle[data-champ="${champ}"] button.on`);
  return b ? +b.dataset.v : null;
};

function majApercu(){
  const v = id => document.getElementById(id)?.value.trim() || "";
  const prev = +v("f-prevues") || 0, fait = +v("f-faites") || 0;
  const som = valEchelle("sommeil"), str = valEchelle("stress"), mot = valEchelle("motivation");
  const a = prev > 0 ? Math.round(fait / prev * 100) : null;
  const r = (som != null && str != null && mot != null)
    ? Math.round((som + (10 - str) + mot) / 3 * 10) / 10 : null;
  const eA = document.getElementById("ap-adh"), eR = document.getElementById("ap-rec"), eP = document.getElementById("ap-poids");
  if(eA){ eA.textContent = a != null ? a + "%" : "—"; eA.style.color = a != null ? teinteAdh(a) : "var(--bordeaux)"; }
  if(eR){ eR.textContent = r != null ? r : "—"; eR.style.color = r != null ? teinte(r) : "var(--bordeaux)"; }
  const dernier = bilansDe(session.nom)[0];
  const p = +v("f-poids");
  if(eP){
    if(p && dernier && dernier.poids){
      const d = Math.round((p - dernier.poids) * 10) / 10;
      eP.textContent = (d > 0 ? "+" : "") + d + " kg";
    } else eP.textContent = "—";
  }
  const liste = champs();
  let remplis = 0;
  liste.forEach(c => {
    if(c.type === "echelle"){ if(valEchelle(c.id) != null) remplis++; }
    else if(c.type === "puces"){ if(choixPuce(c.id)) remplis++; }
    else if(v("f-" + c.id)) remplis++;
  });
  const barre = document.getElementById("barre");
  if(barre) barre.style.width = Math.round(remplis / liste.length * 100) + "%";
}

function sauverBrouillon(){
  const v = id => document.getElementById(id)?.value || "";
  brouillon = {champs:{"f-sem": v("f-sem")}, echelles:{}, puces:{}};
  champs().forEach(c => {
    if(c.type === "echelle") brouillon.echelles[c.id] = valEchelle(c.id);
    else if(c.type === "puces") brouillon.puces[c.id] = choixPuce(c.id);
    else brouillon.champs["f-" + c.id] = v("f-" + c.id);
  });
  try{ sessionStorage.setItem("bbp-brouillon-" + session.nom, JSON.stringify(brouillon)); }catch(e){}
  const e = document.getElementById("etat-brouillon");
  if(e) e.textContent = "Brouillon conservé — tu peux revenir plus tard.";
}
function restaurerBrouillon(){
  let d = null;
  try{ const s = sessionStorage.getItem("bbp-brouillon-" + session.nom); d = s ? JSON.parse(s) : null; }catch(e){}
  if(!d || !d.champs) return;
  Object.entries(d.champs).forEach(([id,val]) => {
    const el = document.getElementById(id); if(el && val) el.value = val;
  });
  Object.entries(d.echelles || {}).forEach(([id,val]) => {
    if(val == null) return;
    const b = document.querySelector(`.echelle[data-champ="${id}"] button[data-v="${val}"]`);
    if(b) b.classList.add("on");
  });
  Object.entries(d.puces || {}).forEach(([c,val]) => {
    if(!val) return;
    [...document.querySelectorAll(`.puces[data-champ="${c}"] .puce`)]
      .filter(b => b.textContent.trim() === val).forEach(b => b.classList.add("on"));
    if(c === "douleur" && val !== "Aucune"){
      const z = document.getElementById("bloc-zoneDouleur"); if(z) z.style.display = "block";
    }
  });
}

async function envoyerBilan(){
  const v = id => document.getElementById(id)?.value.trim() || "";
  const msg = document.getElementById("bilan-msg");
  const liste = champs();
  const manque = [];
  if(!v("f-sem")) manque.push("la semaine");
  liste.filter(c => c.oblig).forEach(c => {
    const rempli = c.type === "echelle" ? valEchelle(c.id) != null
                 : c.type === "puces"   ? !!choixPuce(c.id)
                 : !!v("f-" + c.id);
    if(!rempli) manque.push(c.lbl.toLowerCase());
  });
  if(manque.length){
    msg.className = "msg ko";
    msg.textContent = "Il me manque " + manque.join(", ") + ".";
    return;
  }
  const b = {client: session.nom, semaine: v("f-sem"), statut:"À traiter", analyse:"", ts: Date.now()};
  liste.forEach(c => {
    if(c.type === "echelle") b[c.id] = valEchelle(c.id);
    else if(c.type === "puces") b[c.id] = choixPuce(c.id);
    else if(c.type === "nombre") b[c.id] = +v("f-" + c.id) || (c.id === "faites" || c.id === "prevues" ? 0 : null);
    else b[c.id] = v("f-" + c.id);
  });
  saved = saved.filter(x => cle(x) !== cle(b));
  saved.push(b);
  await enregistrerBilans();
  try{ sessionStorage.removeItem("bbp-brouillon-" + session.nom); }catch(e){}
  msg.className = "msg ok";
  msg.textContent = "Bilan envoyé. Paul l'analyse et te répond avec tes ajustements.";
  setTimeout(() => aller("histo"), 1200);
}

    <p class="lead">Les codes de tes clients et tes coordonnées de contact.</p>
    <div class="section-title">Codes d'accès clients</div>
    <div class="table-wrap"><table class="data">
      <thead><tr><th>Client</th><th>Objectif</th><th>Code</th><th>Bilans</th><th></th></tr></thead>
      <tbody>${Object.entries(CLIENTS).map(([code,c]) => {
        const n = bilansDe(c.nom).length;
        const w = lienWhats();
        return `<tr><td><b>${esc(c.nom)}</b>${c.age?` <small style="color:#9a8478">${esc(c.age)} ans</small>`:""}</td>
        <td>${esc(c.objectif)||"—"}</td>
        <td><code style="background:var(--creme);padding:3px 9px;border-radius:6px">${esc(code)}</code></td>
        <td>${n}</td>
        <td style="white-space:nowrap">
          ${w?`<a class="btn small ghost" href="${w}?text=${encodeURIComponent("Salut "+c.nom+" ! Voici ton espace bilans Build By Paul.\n\nTon code d'accès : "+code+"\n\nTu y déposes ton bilan chaque semaine et tu y retrouves toute ta progression.")}" target="_blank" rel="noopener">Envoyer son code</a>`:""}
          <button class="btn small ghost" onclick="editerFicheClient('${esc(code)}')">Modifier</button>
          <button class="btn small danger" onclick="retirerClient('${esc(code)}')">Retirer</button>
        </td></tr>`;
      }).join("")}</tbody></table></div>

    <div class="section-title">Ajouter un client</div>
    <div class="card">
      <div class="form-grid">
        <div class="field"><label for="n-nom">Prénom<span class="hint">Le code se génère tout seul, tu peux le modifier</span></label>
          <input id="n-nom" type="text" placeholder="Thomas" oninput="proposerCode()"></div>
        <div class="field"><label for="n-code">Son code d'accès</label><input id="n-code" type="text" placeholder="THOMAS-09"></div>
      </div>
      <button class="btn small" style="margin-top:14px" onclick="ajouterClient()">Ajouter</button>
      <div class="msg" id="cli-msg"></div>
    </div>

    <div class="section-title">Contact</div>
    <div class="card">
      <div class="form-grid">
        <div class="field wide"><label for="s-rdv">Lien de prise de RDV</label><input id="s-rdv" type="url" value="${esc(SUPPORTS.rdv||"")}"></div>
        <div class="field"><label for="s-wa">Numéro WhatsApp</label><input id="s-wa" type="tel" value="${esc(SUPPORTS.whatsapp||"")}"></div>
        <div class="field"><label for="s-mail">Email</label><input id="s-mail" type="email" value="${esc(SUPPORTS.email||"")}"></div>
      </div>
      <button class="btn small" style="margin-top:14px" onclick="enregistrerContact()">Enregistrer</button>
      <div class="msg" id="sup-msg"></div>
    </div>
  </div>`;
}

function proposerCode(){
  const nom = document.getElementById("n-nom").value.trim();
  const champ = document.getElementById("n-code");
  if(!nom || champ.dataset.modifie === "1") return;
  const base = nom.toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Z]/g,"");
  let n = Object.keys(CLIENTS).length + 1, code;
  do { code = base + "-" + String(n).padStart(2,"0"); n++; } while(CLIENTS[code]);
  champ.value = code;
}
async function retirerClient(code){
  const c = CLIENTS[code]; if(!c) return;
  const n = bilansDe(c.nom).length;
  if(!document.getElementById("cli-msg")) return;
  const m = document.getElementById("cli-msg");
  m.className = "msg ko";
  m.innerHTML = `Retirer <b>${esc(c.nom)}</b> ? Son code ne fonctionnera plus.${n?` Ses ${n} bilan${n>1?"s":""} sont conservés.`:""}
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn small" style="background:var(--alerte)" onclick="confirmerRetrait('${esc(code)}')">Oui, retirer</button>
      <button class="btn small ghost" onclick="aller('reglages')">Annuler</button></div>`;
  m.scrollIntoView({block:"nearest"});
}
async function confirmerRetrait(code){
  delete CLIENTS[code];
  EDITS.clients = EDITS.clients || {};
  delete EDITS.clients[code];
  EDITS.retires = EDITS.retires || [];
  if(!EDITS.retires.includes(code)) EDITS.retires.push(code);
  await enregistrerEdits();
  aller("reglages");
}

async function ajouterClient(){
  const nom = document.getElementById("n-nom").value.trim();
  const code = document.getElementById("n-code").value.trim().toUpperCase();
  const m = document.getElementById("cli-msg");
  if(!nom || !code){ m.className="msg ko"; m.textContent="Il faut un prénom et un code."; return; }
  if(CLIENTS[code]){ m.className="msg ko"; m.textContent="Ce code est déjà utilisé."; return; }
  CLIENTS[code] = {nom, jour:"dimanche"};
  EDITS.clients = EDITS.clients || {};
  EDITS.clients[code] = {nom, jour:"dimanche"};
  if(EDITS.retires) EDITS.retires = EDITS.retires.filter(c => c !== code);
  await enregistrerEdits();
  aller("reglages");
  const m2 = document.getElementById("cli-msg");
  if(m2){ m2.className = "msg ok";
    m2.innerHTML = `<b>${esc(nom)}</b> ajouté. Son code : <code style="background:#fff;padding:2px 8px;border-radius:6px">${esc(code)}</code> — envoie-le-lui depuis le tableau ci-dessus.`; }
}
async function enregistrerContact(){
  SUPPORTS.rdv = document.getElementById("s-rdv").value.trim();
  SUPPORTS.whatsapp = document.getElementById("s-wa").value.trim();
  SUPPORTS.email = document.getElementById("s-mail").value.trim();
  EDITS.supports = {rdv:SUPPORTS.rdv, whatsapp:SUPPORTS.whatsapp, email:SUPPORTS.email};
  await enregistrerEdits();
  const m = document.getElementById("sup-msg");
  m.className = "msg ok"; m.textContent = "Coordonnées enregistrées.";
}


/* =================================================================
   FICHE CLIENT — modifiable par le client et par le coach
   ================================================================= */
const JOURS = ["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];

function champsFiche(c, prefixe){
  const g = k => esc(c[k] ?? "");
  return `<div class="form-grid">
    <div class="field"><label for="${prefixe}-nom">Prénom affiché</label>
      <input id="${prefixe}-nom" type="text" value="${g("nom")}"></div>
    <div class="field"><label for="${prefixe}-age">Âge</label>
      <input id="${prefixe}-age" type="number" inputmode="numeric" value="${g("age")}"></div>
    <div class="field"><label for="${prefixe}-taille">Taille (cm)</label>
      <input id="${prefixe}-taille" type="number" inputmode="numeric" value="${g("tailleCm")}"></div>
    <div class="field"><label for="${prefixe}-objectif">Objectif</label>
      <select id="${prefixe}-objectif">
        ${["","Recomposition corporelle","Prise de masse","Sèche","Autre"].map(o =>
          `<option value="${o}" ${c.objectif===o?"selected":""}>${o||"— à préciser —"}</option>`).join("")}
      </select></div>
    <div class="field"><label for="${prefixe}-jour">Jour de dépôt du bilan<span class="hint">Celui qui t'arrange le mieux</span></label>
      <select id="${prefixe}-jour">
        ${JOURS.map(j => `<option value="${j}" ${(c.jour||"dimanche")===j?"selected":""}>${j}</option>`).join("")}
      </select></div>
    <div class="field"><label for="${prefixe}-seances">Séances prévues par semaine<span class="hint">Pré-rempli dans ton bilan</span></label>
      <input id="${prefixe}-seances" type="number" inputmode="numeric" value="${esc(c.seances ?? 4)}"></div>
    <div class="field"><label for="${prefixe}-tel">Téléphone</label>
      <input id="${prefixe}-tel" type="tel" value="${g("tel")}"></div>
    <div class="field"><label for="${prefixe}-mail">Email</label>
      <input id="${prefixe}-mail" type="email" value="${g("mail")}"></div>
    <div class="field"><label for="${prefixe}-insta">Instagram</label>
      <input id="${prefixe}-insta" type="text" value="${g("insta")}"></div>
    <div class="field wide"><label for="${prefixe}-notes">Contraintes à connaître<span class="hint">Horaires, matériel, blessure, allergie, ce que tu veux</span></label>
      <textarea id="${prefixe}-notes">${g("notes")}</textarea></div>
  </div>`;
}
function lireFiche(prefixe){
  const v = id => document.getElementById(prefixe + "-" + id)?.value.trim() || "";
  return {
    nom: v("nom"), age: v("age"), tailleCm: v("taille"), objectif: v("objectif"),
    jour: v("jour") || "dimanche", seances: +v("seances") || 4,
    tel: v("tel"), mail: v("mail"), insta: v("insta"), notes: v("notes")
  };
}
async function majFiche(code, donnees){
  const ancien = CLIENTS[code] || {};
  CLIENTS[code] = {...ancien, ...donnees};
  EDITS.clients = EDITS.clients || {};
  EDITS.clients[code] = CLIENTS[code];
  await enregistrerEdits();
}

/* --- Côté client --- */
function vueCompte(){
  const c = CLIENTS[session.code] || {nom: session.nom};
  return `<div class="view">
    <div class="eyebrow">Espace client</div>
    <h2>Mon compte</h2>
    <p class="lead">Tes informations, à jour. Paul les voit de son côté : si quelque chose change dans ta vie, mets-le ici plutôt que de me le répéter chaque semaine.</p>
    <div class="card">
      ${champsFiche(c, "mc")}
      <button class="btn" style="margin-top:18px" onclick="enregistrerMonCompte()">Enregistrer</button>
      <div class="msg" id="mc-msg"></div>
    </div>
    <div class="section-title">Mon accès</div>
    <div class="card">
      <div class="kv">
        <div>Mon code</div><div><code style="background:var(--creme);padding:3px 9px;border-radius:6px">${esc(session.code)}</code></div>
        <div>Bilans déposés</div><div>${bilansDe(session.nom).length}</div>
      </div>
      <p style="font-size:13px;color:#8a7466;margin-top:12px">Ton code ne se modifie pas ici — demande à Paul si tu veux en changer.</p>
    </div>
  </div>`;
}
async function enregistrerMonCompte(){
  const d = lireFiche("mc");
  const m = document.getElementById("mc-msg");
  if(!d.nom){ m.className = "msg ko"; m.textContent = "Il faut au moins un prénom."; return; }
  const ancienNom = session.nom;
  await majFiche(session.code, d);
  /* si le prénom change, les bilans suivent */
  if(d.nom !== ancienNom){
    saved.forEach(b => { if(b.client === ancienNom) b.client = d.nom; });
    await enregistrerBilans();
    if(INDEX_MEDIA[ancienNom]){
      INDEX_MEDIA[d.nom] = INDEX_MEDIA[ancienNom];
      await sauverIndex(d.nom);
      INDEX_MEDIA[ancienNom] = null;
    }
  }
  session = {...session, ...d};
  document.getElementById("who-name").textContent = session.nom;
  m.className = "msg ok"; m.textContent = "Informations enregistrées.";
}

/* --- Côté coach --- */
function editerFicheClient(code){
  const c = CLIENTS[code]; if(!c) return;
  const bs = bilansDe(c.nom);
  document.getElementById("modal").innerHTML = `<div class="modal-card">
    <div class="modal-head">
      <div class="av">${esc((c.nom||"?")[0])}</div>
      <div><h3>Fiche de ${esc(c.nom)}</h3>
        <div style="font-size:12.5px;opacity:.85">Code ${esc(code)} · ${bs.length} bilan${bs.length>1?"s":""}</div></div>
      <button class="x" onclick="closeModal()" aria-label="Fermer">✕</button>
    </div>
    <div class="modal-body">
      ${champsFiche(c, "fc")}
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px">
        <button class="btn" onclick="enregistrerFicheClient('${esc(code)}')">Enregistrer</button>
        <button class="btn ghost" onclick="closeModal()">Annuler</button>
      </div>
      <div class="msg" id="fc-msg"></div>
    </div></div>`;
  document.getElementById("modal").classList.add("on");
}
async function enregistrerFicheClient(code){
  const d = lireFiche("fc");
  const m = document.getElementById("fc-msg");
  if(!d.nom){ m.className = "msg ko"; m.textContent = "Il faut au moins un prénom."; return; }
  const ancienNom = CLIENTS[code].nom;
  await majFiche(code, d);
  if(d.nom !== ancienNom){
    saved.forEach(b => { if(b.client === ancienNom) b.client = d.nom; });
    await enregistrerBilans();
  }
  closeModal(); aller("reglages");
}


/* =================================================================
   ADMINISTRATION — les données suivies dans les bilans
   ================================================================= */
const TYPES = [["nombre","Un nombre"],["echelle","Une note de 0 à 10"],["puces","Un choix parmi plusieurs"],["texte","Du texte libre"]];

function vueDonnees(){
  const conf = EDITS.champs || {};
  const off = conf.off || [];
  const perso = (conf.perso || []).map(c => c.id);
  const tous = [...CHAMPS_DEFAUT, ...(conf.perso || [])];
  const parSection = SECTIONS.map(sec => {
    const dedans = tous.filter(c => c.sec === sec);
    if(!dedans.length) return "";
    return `<div class="section-titre-form">${sec}</div>
      <div class="table-wrap" style="margin-bottom:16px"><table class="data">
        <thead><tr><th>Donnée</th><th>Type</th><th>État</th><th></th></tr></thead>
        <tbody>${dedans.map(c => {
          const actif = c.verrou || !off.includes(c.id);
          return `<tr>
            <td><b>${esc(c.lbl)}</b>${c.verrou?` <span class="pill neutral">socle</span>`:""}${perso.includes(c.id)?` <span class="pill ok">ajoutée</span>`:""}
              ${c.aide?`<br><small style="color:#9a8478">${esc(c.aide)}</small>`:""}</td>
            <td>${esc((TYPES.find(t=>t[0]===c.type)||["",c.type])[1])}</td>
            <td>${actif?`<span class="pill ok">Suivie</span>`:`<span class="pill warn">Retirée</span>`}</td>
            <td style="white-space:nowrap">
              ${c.verrou
                ? `<span style="font-size:12px;color:#9a8478">Nécessaire aux calculs</span>`
                : `<button class="btn small ${actif?"ghost":""}" onclick="basculerChamp('${esc(c.id)}')">${actif?"Retirer":"Remettre"}</button>
                   ${perso.includes(c.id)?`<button class="btn small danger" onclick="supprimerChamp('${esc(c.id)}')">Supprimer</button>`:""}`}
            </td></tr>`;
        }).join("")}</tbody></table></div>`;
  }).join("");

  return `<div class="view">
    <div class="eyebrow">Administration</div>
    <h2>Données suivies</h2>
    <p class="lead">Choisis ce que tes clients remplissent dans leur bilan. Retire ce qui ne te sert pas, ajoute ce qui te manque. Les données du socle alimentent l'adhérence, la récupération et les courbes : elles ne peuvent pas être retirées.</p>
    <div class="notice" style="margin-top:0;margin-bottom:22px">Retirer une donnée ne supprime rien : elle disparaît du formulaire, mais les valeurs déjà déposées restent dans les bilans passés et dans l'export.</div>
    ${parSection}

    <div class="section-title">Ajouter une donnée</div>
    <div class="card">
      <div class="form-grid">
        <div class="field"><label for="d-lbl">Intitulé<span class="hint">Ce que le client lira</span></label>
          <input id="d-lbl" type="text" placeholder="Tour de mollet (cm)"></div>
        <div class="field"><label for="d-type">Type de réponse</label>
          <select id="d-type" onchange="majFormDonnee()">
            ${TYPES.map(t => `<option value="${t[0]}">${t[1]}</option>`).join("")}
          </select></div>
        <div class="field"><label for="d-sec">Section du formulaire</label>
          <select id="d-sec">${SECTIONS.map(x => `<option value="${x}">${x}</option>`).join("")}</select></div>
        <div class="field" id="bloc-unite"><label for="d-unite">Unité<span class="hint">Facultatif : cm, kg, min…</span></label>
          <input id="d-unite" type="text" placeholder=" cm"></div>
        <div class="field wide" id="bloc-options" style="display:none"><label for="d-options">Les choix possibles<span class="hint">Séparés par une virgule</span></label>
          <input id="d-options" type="text" placeholder="Jamais, Parfois, Souvent, Tout le temps"></div>
        <div class="field wide"><label for="d-aide">Précision affichée sous l'intitulé<span class="hint">Facultatif</span></label>
          <input id="d-aide" type="text" placeholder="Mesuré au plus large, à froid"></div>
      </div>
      <button class="btn" style="margin-top:16px" onclick="ajouterChamp()">Ajouter cette donnée</button>
      <div class="msg" id="d-msg"></div>
    </div>
  </div>`;
}
function majFormDonnee(){
  const t = document.getElementById("d-type").value;
  document.getElementById("bloc-options").style.display = t === "puces" ? "block" : "none";
  document.getElementById("bloc-unite").style.display = t === "nombre" ? "block" : "none";
}
async function basculerChamp(id){
  EDITS.champs = EDITS.champs || {};
  const off = EDITS.champs.off = EDITS.champs.off || [];
  const i = off.indexOf(id);
  if(i >= 0) off.splice(i,1); else off.push(id);
  await enregistrerEdits();
  aller("donnees");
}
async function supprimerChamp(id){
  EDITS.champs = EDITS.champs || {};
  EDITS.champs.perso = (EDITS.champs.perso || []).filter(c => c.id !== id);
  await enregistrerEdits();
  aller("donnees");
}
async function ajouterChamp(){
  const v = id => document.getElementById(id).value.trim();
  const m = document.getElementById("d-msg");
  const lbl = v("d-lbl"), type = v("d-type");
  if(!lbl){ m.className = "msg ko"; m.textContent = "Il faut un intitulé."; return; }
  const options = type === "puces" ? v("d-options").split(",").map(x => x.trim()).filter(Boolean) : null;
  if(type === "puces" && options.length < 2){
    m.className = "msg ko"; m.textContent = "Indique au moins deux choix, séparés par une virgule."; return;
  }
  const base = lbl.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"").slice(0,18) || "champ";
  let id = base, n = 2;
  const pris = [...CHAMPS_DEFAUT, ...((EDITS.champs||{}).perso || [])].map(c => c.id);
  while(pris.includes(id)) id = base + (n++);
  const c = {id, lbl, type, sec: v("d-sec"), aide: v("d-aide") || undefined};
  if(type === "nombre" && v("d-unite")) c.unite = v("d-unite");
  if(type === "puces") c.options = options;
  EDITS.champs = EDITS.champs || {};
  EDITS.champs.perso = [...(EDITS.champs.perso || []), c];
  await enregistrerEdits();
  aller("donnees");
  const m2 = document.getElementById("d-msg");
  if(m2){ m2.className = "msg ok"; m2.textContent = `« ${lbl} » sera demandé dans le prochain bilan de tes clients.`; }
}

/* =================================================================
   Outils
   ================================================================= */
function lienWhats(){
  const n = (SUPPORTS.whatsapp||"").replace(/[^0-9+]/g,"");
  if(!n) return "";
  let d = n.replace(/\+/g,"");
  if(d.startsWith("0")) d = "33" + d.slice(1);
  return "https://wa.me/" + d;
}
function telecharger(nom, csv){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8"}));
  a.download = nom; a.click();
}
function exporterBilans(){
  const liste = champs();
  const cols = ["client","semaine", ...liste.map(c => c.id), "analyse","statut"];
  const ent  = ["Client","Semaine", ...liste.map(c => c.lbl), "Analyse","Statut"];
  const l = o => cols.map(k => `"${String(o[k]??"").replace(/"/g,'""')}"`).join(";");
  telecharger("bilans-build-by-paul.csv", ent.join(";") + "\n" + bilans().map(l).join("\n"));
}
function exporterProspects(){
  const cols = ["date","prenom","nom","age","tel","mail","insta","taille","poids","objectif","anciennete","seances","bilan","canal","dispo","bloque"];
  const ent = ["Reçue le","Prénom","Nom","Âge","Téléphone","Email","Instagram","Taille","Poids","Objectif","Ancienneté","Séances","Bilan hebdo","Canal","Disponibilités","Ce qui bloque"];
  const l = o => cols.map(k => `"${String(o[k]??"").replace(/"/g,'""')}"`).join(";");
  telecharger("prospects-build-by-paul.csv", ent.join(";") + "\n" + PROSPECTS.map(l).join("\n"));
}

document.getElementById("code").addEventListener("keydown", e => { if(e.key === "Enter") login(); });
document.addEventListener("input", e => { if(e.target.id === "n-code") e.target.dataset.modifie = "1"; });
document.getElementById("logo-gate").src = LOGO;
document.getElementById("logo-bar").src = LOGO;
</script>
</body>
</html>
